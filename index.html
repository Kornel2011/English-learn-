<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETRO ENGLISH — From Zero to Native</title>
<style>
:root {
  --bg: #0a0a0c;
  --bg2: #121218;
  --bg3: #1a1a22;
  --card: #16161e;
  --border: #2a2a35;
  --text: #e8e8f0;
  --text-dim: #9898a8;
  --accent: #e63946;
  --accent2: #457b9d;
  --accent-glow: rgba(230, 57, 70, 0.4);
  --green: #2a9d8f;
  --yellow: #e9c46a;
  --purple: #9b5de5;
  --font-mono: 'Courier New', 'Consolas', monospace;
  --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 8px;
  --sidebar-w: 260px;
  --transition: 0.25s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

/* CRT / Scanline */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
  z-index: 9998;
  opacity: 0.6;
}
body.no-crt::before { display: none; }
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.3) 100%);
  pointer-events: none;
  z-index: 9997;
}
body.no-crt::after { display: none; }

/* Animated bg grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(230,57,70,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(69,123,157,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: -1;
  animation: gridMove 20s linear infinite;
}
body.no-anim .bg-grid { animation: none; }
@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 40px 40px; }
}

/* Layout */
.app {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform var(--transition);
}
.sidebar-header {
  padding: 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.logo {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
  text-shadow: 0 0 10px var(--accent-glow);
}
.logo span { color: var(--accent2); }
.nav {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem 0.5rem;
}
.nav-section {
  margin-bottom: 0.5rem;
}
.nav-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  padding: 0.5rem 0.75rem 0.25rem;
  font-family: var(--font-mono);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 0.9rem;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.nav-item:hover, .nav-item:focus-visible {
  background: var(--bg3);
  color: var(--text);
  outline: none;
}
.nav-item.active {
  background: rgba(230,57,70,0.15);
  color: var(--accent);
  box-shadow: inset 3px 0 0 var(--accent);
}
.nav-item .icon { font-size: 1.1rem; width: 1.4rem; text-align: center; }

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  position: sticky;
  top: 0;
  background: rgba(10,10,12,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
  gap: 1rem;
}
.hamburger {
  display: none;
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.4rem 0.6rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 1.2rem;
}
.search-box {
  flex: 1;
  max-width: 360px;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.5rem 0.75rem 0.5rem 2.2rem;
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
  transition: border var(--transition);
}
.search-box input:focus { border-color: var(--accent2); }
.search-box .search-icon {
  position: absolute;
  left: 0.7rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}
.top-stats {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-family: var(--font-mono);
  font-size: 0.8rem;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--bg3);
  padding: 0.3rem 0.65rem;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.stat-pill .val { color: var(--accent); font-weight: 600; }

.content {
  flex: 1;
  padding: 1.5rem;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  transition: all var(--transition);
}
.card:hover { border-color: rgba(230,57,70,0.3); }
.card-glow { box-shadow: 0 0 20px rgba(230,57,70,0.08); }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.55rem 1.1rem;
  border-radius: var(--radius);
  border: 1px solid transparent;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  background: var(--bg3);
  color: var(--text);
}
.btn:hover, .btn:focus-visible {
  transform: translateY(-1px);
  outline: none;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
}
.btn-primary:hover { background: #ff4d5a; box-shadow: 0 0 18px var(--accent-glow); }
.btn-secondary {
  background: transparent;
  border-color: var(--accent2);
  color: var(--accent2);
}
.btn-secondary:hover { background: rgba(69,123,157,0.15); }
.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text-dim);
}
.btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
.btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
.btn-block { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Typography */
h1, h2, h3, h4 { font-weight: 600; line-height: 1.3; }
h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
h2 { font-size: 1.35rem; margin-bottom: 0.75rem; }
h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.mono { font-family: var(--font-mono); }
.text-dim { color: var(--text-dim); }
.text-accent { color: var(--accent); }
.text-blue { color: var(--accent2); }
.text-green { color: var(--green); }
.text-sm { font-size: 0.85rem; }
.mb-1 { margin-bottom: 0.5rem; }
.mb-2 { margin-bottom: 1rem; }
.mb-3 { margin-bottom: 1.5rem; }
.mt-2 { margin-top: 1rem; }
.gap-1 { gap: 0.5rem; }
.gap-2 { gap: 1rem; }
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }

/* Progress bar */
.progress-bar {
  height: 8px;
  background: var(--bg3);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 4px;
  transition: width 0.6s ease;
  box-shadow: 0 0 8px var(--accent-glow);
}
body.no-anim .progress-fill { transition: none; }

/* Badge */
.badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-a0 { background: #333; color: #aaa; }
.badge-a1 { background: rgba(42,157,143,0.2); color: var(--green); }
.badge-a2 { background: rgba(69,123,157,0.2); color: var(--accent2); }
.badge-b1 { background: rgba(233,196,106,0.2); color: var(--yellow); }
.badge-b2 { background: rgba(230,57,70,0.2); color: var(--accent); }
.badge-c1 { background: rgba(155,93,229,0.2); color: var(--purple); }
.badge-c2 { background: rgba(230,57,70,0.3); color: #ff6b7a; }
.badge-native { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }

/* Lesson / content blocks */
.lesson-block {
  background: var(--bg3);
  border-left: 3px solid var(--accent);
  padding: 1rem 1.25rem;
  margin: 1rem 0;
  border-radius: 0 var(--radius) var(--radius) 0;
}
.example {
  background: rgba(69,123,157,0.1);
  border: 1px solid rgba(69,123,157,0.3);
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  margin: 0.5rem 0;
  font-family: var(--font-mono);
  font-size: 0.9rem;
}
.mistake {
  background: rgba(230,57,70,0.08);
  border: 1px solid rgba(230,57,70,0.25);
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  margin: 0.5rem 0;
}
.formula {
  background: var(--bg);
  border: 1px dashed var(--border);
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  font-family: var(--font-mono);
  color: var(--accent2);
  margin: 0.5rem 0;
}

/* Quiz */
.quiz-option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.75rem 1rem;
  margin: 0.4rem 0;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  font-size: 0.95rem;
}
.quiz-option:hover { border-color: var(--accent2); background: rgba(69,123,157,0.1); }
.quiz-option.correct { border-color: var(--green); background: rgba(42,157,143,0.15); }
.quiz-option.wrong { border-color: var(--accent); background: rgba(230,57,70,0.15); }
.quiz-option:disabled { cursor: default; }

/* Flashcard */
.flashcard {
  perspective: 1000px;
  height: 220px;
  cursor: pointer;
  margin: 1rem auto;
  max-width: 400px;
}
.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s;
  transform-style: preserve-3d;
}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
body.no-anim .flashcard-inner { transition: none; }
.flashcard-front, .flashcard-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  text-align: center;
}
.flashcard-back {
  transform: rotateY(180deg);
  border-color: var(--accent2);
}
.flashcard-word { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
.flashcard-hint { font-size: 0.8rem; color: var(--text-dim); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s;
  padding: 1rem;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 500px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 1.5rem;
  box-shadow: 0 0 40px rgba(230,57,70,0.15);
  transform: scale(0.95);
  transition: transform 0.2s;
}
.modal-overlay.show .modal { transform: scale(1); }
body.no-anim .modal-overlay, body.no-anim .modal { transition: none; }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.toast {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  animation: toastIn 0.3s ease;
  max-width: 320px;
  font-size: 0.9rem;
}
body.no-anim .toast { animation: none; }
@keyframes toastIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* Achievement popup */
.ach-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: var(--bg2);
  border: 2px solid var(--accent);
  border-radius: 12px;
  padding: 2rem;
  text-align: center;
  z-index: 3000;
  box-shadow: 0 0 60px var(--accent-glow);
  opacity: 0;
  visibility: hidden;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.ach-popup.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}
.ach-popup .icon { font-size: 3rem; margin-bottom: 0.5rem; }

/* Cursor blink */
.cursor-blink::after {
  content: '█';
  animation: blink 1s step-end infinite;
  color: var(--accent);
  margin-left: 2px;
}
body.no-anim .cursor-blink::after { animation: none; opacity: 1; }
@keyframes blink { 50% { opacity: 0; } }

/* Level map */
.cefr-map {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 1rem 0;
}
.cefr-node {
  padding: 0.5rem 0.9rem;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg3);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  cursor: pointer;
  transition: all var(--transition);
}
.cefr-node:hover { border-color: var(--accent2); }
.cefr-node.current { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.cefr-node.done { background: rgba(42,157,143,0.15); border-color: var(--green); }

/* Vocab card */
.vocab-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
  transition: all var(--transition);
}
.vocab-card:hover { border-color: var(--accent2); }
.vocab-card .word { font-size: 1.15rem; font-weight: 600; }
.vocab-card .pos { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }
.vocab-card.fav { border-color: var(--yellow); }

/* Tabs */
.tabs {
  display: flex;
  gap: 0.25rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.25rem;
  overflow-x: auto;
}
.tab {
  padding: 0.6rem 1rem;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9rem;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Input / form */
input[type="text"], input[type="number"], select, textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.5rem 0.75rem;
  color: var(--text);
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent2); }
textarea { min-height: 120px; resize: vertical; }

/* Sidebar mobile */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}
@media (max-width: 860px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.show { display: block; }
  .main { margin-left: 0; }
  .hamburger { display: block; }
  .top-stats .stat-pill:nth-child(n+3) { display: none; }
  .content { padding: 1rem; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

/* Welcome screen */
.welcome {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  position: relative;
}
.welcome h1 {
  font-family: var(--font-mono);
  font-size: clamp(2rem, 6vw, 3.5rem);
  letter-spacing: 3px;
  text-shadow: 0 0 20px var(--accent-glow);
  margin-bottom: 0.5rem;
}
.welcome .tagline {
  font-size: 1.1rem;
  color: var(--text-dim);
  margin-bottom: 2rem;
  font-family: var(--font-mono);
}
.welcome-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
  margin: 1.5rem 0 2rem;
}
.welcome-stat {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 0.75rem 1.25rem;
  border-radius: var(--radius);
  min-width: 120px;
}
.welcome-stat .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.welcome-stat .value { font-size: 1.4rem; font-weight: 700; font-family: var(--font-mono); color: var(--accent); }

/* Misc */
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
ul.clean { list-style: none; }
ul.clean li { padding: 0.3rem 0; }
ul.clean li::before { content: '▸ '; color: var(--accent); }
.ipa { font-family: var(--font-mono); color: var(--accent2); font-size: 0.85rem; }
.tag {
  display: inline-block;
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  font-size: 0.7rem;
  margin: 0.15rem;
}
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
  align-items: center;
}
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }

/* Chart simple */
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 0.5rem;
  height: 120px;
  padding: 0.5rem 0;
}
.bar-chart .bar {
  flex: 1;
  background: linear-gradient(to top, var(--accent), var(--accent2));
  border-radius: 4px 4px 0 0;
  min-width: 20px;
  position: relative;
  transition: height 0.5s ease;
}
.bar-chart .bar span {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.65rem;
  color: var(--text-dim);
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- WELCOME SCREEN -->
<div id="welcomeScreen" class="welcome">
  <h1 class="cursor-blink">RETRO ENGLISH</h1>

/* -------------------- LOCAL STORAGE -------------------- */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      Object.assign(state.user, saved);
    }
  } catch (e) { console.warn('Load failed', e); }
  applySettings();
  updateStreak();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.user));
  } catch (e) { console.warn('Save failed', e); }
}

function applySettings() {
  const s = state.user.settings;
  document.body.classList.toggle('no-anim', !s.animations);
  document.body.classList.toggle('no-crt', !s.crt);
}

function updateStreak() {
  const today = new Date().toDateString();
  const last = state.user.lastActive;
  if (!last) {
    state.user.lastActive = today;
    saveState();
    return;
  }
  if (last === today) return;
  const lastDate = new Date(last);
  const diff = Math.floor((new Date(today) - lastDate) / 86400000);
  if (diff === 1) {
    state.user.streak += 1;
  } else if (diff > 1) {
    state.user.streak = 1;
  }
  state.user.lastActive = today;
  state.user.dailyXP = 0;
  saveState();
}

/* -------------------- XP & PROGRESS -------------------- */
function addXP(amount, reason) {
  state.user.xp += amount;
  state.user.dailyXP += amount;
  const newLevel = Math.floor(state.user.xp / 100) + 1;
  if (newLevel > state.user.level) {
    state.user.level = newLevel;
    toast(`Level up! You are now level ${newLevel}`, '🎉');
  }
  updateCEFR();
  checkAchievements();
  saveState();
  updateTopBar();
  if (reason) toast(`+${amount} XP — ${reason}`);
}

function updateCEFR() {
  const completed = Object.keys(state.user.completedLessons).length;
  const total = LESSONS.length;
  const pct = completed / total;
  if (pct >= 0.95) state.user.cefr = 'Native';
  else if (pct >= 0.85) state.user.cefr = 'C2';
  else if (pct >= 0.7) state.user.cefr = 'C1';
  else if (pct >= 0.55) state.user.cefr = 'B2';
  else if (pct >= 0.4) state.user.cefr = 'B1';
  else if (pct >= 0.25) state.user.cefr = 'A2';
  else if (pct >= 0.1) state.user.cefr = 'A1';
  else state.user.cefr = 'A0';
}

function getProgressPercent() {
  const done = Object.keys(state.user.completedLessons).length;
  return Math.round((done / LESSONS.length) * 100);
}

function completeLesson(id) {
  if (state.user.completedLessons[id]) return;
  state.user.completedLessons[id] = Date.now();
  addXP(25, 'Lesson completed');
  if (!state.user.recentlyViewed.includes(id)) {
    state.user.recentlyViewed.unshift(id);
    state.user.recentlyViewed = state.user.recentlyViewed.slice(0, 10);
  }
  checkAchievements();
  saveState();
  toast('Lesson marked as completed! +25 XP');
}

function checkAchievements() {
  ACHIEVEMENTS_DEF.forEach(a => {
    if (!state.user.achievements.includes(a.id) && a.condition(state.user)) {
      state.user.achievements.push(a.id);
      showAchievement(a);
      saveState();
    }
  });
}

/* -------------------- UI HELPERS -------------------- */
function toast(msg, icon = '') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = (icon ? icon + ' ' : '') + msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function showAchievement(a) {
  const p = document.getElementById('achPopup');
  document.getElementById('achTitle').textContent = a.title;
  document.getElementById('achDesc').textContent = a.desc;
  p.querySelector('.icon').textContent = a.icon;
  p.classList.add('show');
  setTimeout(() => p.classList.remove('show'), 3000);
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal();
});

function badgeClass(level) {
  const m = {A0:'badge-a0',A1:'badge-a1',A2:'badge-a2',B1:'badge-b1',B2:'badge-b2',C1:'badge-c1',C2:'badge-c2',Native:'badge-native'};
  return m[level] || 'badge-a0';
}

/* -------------------- SPEECH ENGINE -------------------- */
const Speech = {
  synth: window.speechSynthesis,
  recog: null,
  speaking: false,
  init() {
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      this.recog = new SR();
      this.recog.lang = 'en-US';
      this.recog.continuous = false;
      this.recog.interimResults = false;
    }
  },
  speak(text, rate = 1) {
    if (!this.synth) return;
    this.synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate * (state.user.settings.speechSpeed || 1);
    this.speaking = true;
    u.onend = () => { this.speaking = false; };
    this.synth.speak(u);
  },
  stop() { if (this.synth) this.synth.cancel(); this.speaking = false; },
  listen(onResult, onError) {
    if (!this.recog) {
      onError && onError('Speech recognition not supported in this browser.');
      return;
    }
    this.recog.onresult = e => onResult(e.results[0][0].transcript);
    this.recog.onerror = e => onError && onError(e.error);
    this.recog.start();
  }
};
Speech.init();

/* -------------------- NAVIGATION -------------------- */
function navigate(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  render();
}

document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-item');
  if (btn) navigate(btn.dataset.view);
});

document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
});

/* -------------------- SEARCH -------------------- */
document.getElementById('globalSearch').addEventListener('input', e => {
  state.searchQuery = e.target.value.trim().toLowerCase();

  const root = document.getElementById('mainContent');
  const v = state.currentView;
  if (v === 'dashboard') root.innerHTML = renderDashboard();
  else if (v === 'learn') root.innerHTML = renderLearn();
  else if (v === 'grammar') root.innerHTML = renderGrammar();
  else if (v === 'vocabulary') root.innerHTML = renderVocabulary();
  else if (v === 'listening') root.innerHTML = renderListening();
  else if (v === 'speaking') root.innerHTML = renderSpeaking();
  else if (v === 'reading') root.innerHTML = renderReading();
  else if (v === 'writing') root.innerHTML = renderWriting();
  else if (v === 'pronunciation') root.innerHTML = renderPronunciation();
  else if (v === 'phrases') root.innerHTML = renderPhrases();
  else if (v === 'phrasals') root.innerHTML = renderPhrasals();
  else if (v === 'idioms') root.innerHTML = renderIdioms();
  else if (v === 'quizzes') root.innerHTML = renderQuizzes();
  else if (v === 'flashcards') root.innerHTML = renderFlashcards();
  else if (v === 'review') root.innerHTML = renderReview();
  else if (v === 'progress') root.innerHTML = renderProgress();
  else if (v === 'achievements') root.innerHTML = renderAchievements();
  else if (v === 'native') root.innerHTML = renderNative();

  else if (v === 'search') root.innerHTML = renderSearch();
  else if (v === 'lesson') root.innerHTML = renderLessonView();
  else root.innerHTML = renderDashboard();
  bindDynamicEvents();
  updateTopBar();
}

  const byLevel = {};
  LEVELS.forEach(l => byLevel[l] = LESSONS.filter(x => x.level === l));
  let html = `<h1>Learn</h1><p class="text-dim mb-2">Full course path from A0 to Native.</p>

      <button class="btn btn-sm btn-ghost" onclick="filterLearn('all')">All</button>

    if (!byLevel[level].length) return;
    html += `<h3 class="mt-2"><span class="badge ${badgeClass(level)}">${level}</span></h3><div class="grid-2">`;
    byLevel[level].forEach(l => {
      const done = !!state.user.completedLessons[l.id];
      html += `<div class="card" style="${done?'border-color:var(--green)':''}">
        <div class="flex justify-between items-center mb-1">
          <span class="badge ${badgeClass(l.level)}">${l.level}</span>

  html += `</div>`;
  return html;
}

function filterLearn(level) {
  navigate('learn');
  setTimeout(() => {
    if (level === 'all') return;
    document.querySelectorAll('#lessonList .card').forEach(c => {
      const badge = c.querySelector('.badge');
      c.style.display = badge && badge.textContent === level ? '' : 'none';
    });
  }, 50);
}

function openLesson(id) {
  state.currentLesson = LESSONS.find(l => l.id === id);
  if (!state.currentLesson) return;
  if (!state.user.recentlyViewed.includes(id)) {
    state.user.recentlyViewed.unshift(id);
    state.user.recentlyViewed = state.user.recentlyViewed.slice(0, 10);
    saveState();
  }
  state.currentView = 'lesson';
  render();
}

function checkMini(selected, correct, btn) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  if (selected === correct) {
    btn.classList.add('correct');
    toast('Correct! +5 XP');
    addXP(5, 'Mini exercise');
  } else {
    btn.classList.add('wrong');
    parent.querySelectorAll('.quiz-option')[correct].classList.add('correct');
    toast('Not quite — look at the green one.');
  }
}

function checkMiniFill(answer) {
  const input = document.getElementById('miniInput');
  const res = document.getElementById('miniResult');
  const val = (input.value || '').trim().toLowerCase();
  if (val === answer.toLowerCase() || val.includes(answer.toLowerCase())) {
    res.innerHTML = '<span class="text-green">✓ Correct!</span>';
    addXP(5, 'Mini exercise');
  } else {
    res.innerHTML = `<span class="text-accent">✗ Expected something like: ${answer}</span>`;
  }
}

function startLessonQuiz() {
  const l = state.currentLesson;
  state.currentQuiz = { questions: l.quiz, index: 0, score: 0, title: l.title + ' Quiz' };
  renderQuizEngine();
}

function renderQuizEngine() {
  const qz = state.currentQuiz;
  if (!qz) return;
  if (qz.index >= qz.questions.length) {
    const pct = Math.round((qz.score / qz.questions.length) * 100);
    const xp = Math.round(pct / 10) * 5 + 10;
    addXP(xp, 'Quiz finished');
    state.user.quizScores[qz.title || 'quiz'] = { score: qz.score, total: qz.questions.length, pct, date: Date.now() };
    saveState();
    checkAchievements();
    document.getElementById('mainContent').innerHTML = `
      <h1>Quiz Complete</h1>
      <div class="card card-glow mb-2">
        <div style="font-size:2.5rem;font-family:var(--font-mono);color:var(--accent)">${pct}%</div>
        <p>${qz.score} / ${qz.questions.length} correct · +${xp} XP</p>
      </div>
      <button class="btn btn-primary" onclick="navigate('quizzes')">Back to Quizzes</button>
      <button class="btn btn-ghost" onclick="state.currentQuiz.index=0;state.currentQuiz.score=0;renderQuizEngine()">Retry</button>
    `;
    return;
  }
  const q = qz.questions[qz.index];
  let body = `<p class="text-dim text-sm">Question ${qz.index + 1} of ${qz.questions.length}</p><h3 class="mb-2">${q.q}</h3>`;
  if (q.type === 'multiple') {
    body += q.options.map((o, i) =>
      `<button class="quiz-option" onclick="answerQuiz(${i}, ${q.a})">${o}</button>`
    ).join('');
  } else if (q.type === 'fill') {
    body += `<input type="text" id="quizFill" placeholder="Type your answer...">
      <button class="btn btn-primary mt-2" onclick="answerQuizFill('${(q.a+'').replace(/'/g,"\\'")}')">Submit</button>`;
  }
  document.getElementById('mainContent').innerHTML = `
    <h1>${qz.title || 'Quiz'}</h1>
    <div class="card">${body}</div>
    <div class="progress-bar mt-2"><div class="progress-fill" style="width:${(qz.index/qz.questions.length)*100}%"></div></div>
  `;
}

function answerQuiz(selected, correct) {
  if (selected === correct) state.currentQuiz.score++;
  state.currentQuiz.index++;
  renderQuizEngine();
}

function answerQuizFill(correct) {
  const val = (document.getElementById('quizFill').value || '').trim().toLowerCase();
  if (val === correct.toLowerCase() || val.includes(correct.toLowerCase())) state.currentQuiz.score++;
  state.currentQuiz.index++;
  renderQuizEngine();
}

function filterVocab() {
  const q = (document.getElementById('vocabSearch')?.value || '').toLowerCase();

  const level = document.getElementById('vocabLevel')?.value || '';
  document.querySelectorAll('#vocabGrid .vocab-card').forEach(c => {
    const matchQ = !q || c.dataset.en.includes(q);
    const matchC = !cat || c.dataset.cat === cat;
    const matchL = !level || c.dataset.level === level;
    c.style.display = matchQ && matchC && matchL ? '' : 'none';
  });

function toggleFav(id) {
  const i = state.user.favorites.indexOf(id);
  if (i >= 0) state.user.favorites.splice(i, 1);
  else state.user.favorites.push(id);
  saveState();
  render();
}

  saveState();
  checkAchievements();

  const supported = !!Speech.recog;
  return `
    <h1>Speaking</h1>
    <p class="text-dim mb-2">Practice speaking. ${supported ? 'Speech recognition is available in your browser.' : 'Speech recognition is not supported in this browser — you can still practise by reading aloud.'}</p>
    ${prompts.map(p => `
      <div class="card mb-2">
        <span class="badge ${badgeClass(p.level)}">${p.level}</span>
        <p class="mb-1">${p.text}</p>
        <button class="btn btn-sm btn-primary" onclick="Speech.speak(\`${p.text.replace(/`/g,"'")}\`)">🔊 Hear prompt</button>
        ${supported ? `<button class="btn btn-sm btn-secondary" onclick="startSpeakPractice()">🎤 Record answer</button>` : ''}
      </div>
    `).join('')}
    <div id="speakResult" class="card mt-2 hidden"></div>
  `;
}

function startSpeakPractice() {
  const res = document.getElementById('speakResult');
  res.classList.remove('hidden');
  res.innerHTML = '<p class="text-dim">Listening... speak now.</p>';
  Speech.listen(
    transcript => {
      res.innerHTML = `<p><strong>You said:</strong> ${transcript}</p><p class="text-sm text-dim">Compare with the prompt and try again if needed.</p>`;
      addXP(5, 'Speaking practice');
    },
    err => { res.innerHTML = `<p class="text-accent">Error: ${err}</p>`; }
  );
}

function renderReading() {
  return `
    <h1>Reading</h1>
    <p class="text-dim mb-2">Passages from A1 to C1 with comprehension questions.</p>
    ${READINGS.map(r => `
      <div class="card mb-2">
        <span class="badge ${badgeClass(r.level)}">${r.level}</span>
        <h4>${r.title}</h4>
        <button class="btn btn-sm btn-primary" onclick="openReading('${r.id}')">Read & Answer</button>
      </div>
    `).join('')}
  `;
}

function openReading(id) {
  const r = READINGS.find(x => x.id === id);
  if (!r) return;
  openModal(`
    <h2>${r.title} <span class="badge ${badgeClass(r.level)}">${r.level}</span></h2>
    <div class="lesson-block" style="max-height:200px;overflow-y:auto">${r.text}</div>
    <h4 class="mt-2">Vocabulary</h4>
    <div class="flex flex-wrap gap-1 mb-2">${r.vocab.map(v => `<span class="tag">${v.en} — ${v.pl}</span>`).join('')}</div>
    <h4>Questions</h4>
    ${r.questions.map((q, i) => `
      <p class="mb-1">${i+1}. ${q.q}</p>
      <input type="text" id="rq${i}" placeholder="Your answer..." class="mb-1">
    `).join('')}
    <button class="btn btn-primary mt-2" onclick="checkReading('${r.id}')">Check answers</button>
    <div id="readingResult" class="mt-2"></div>
    <button class="btn btn-ghost mt-2" onclick="closeModal()">Close</button>
  `);
}

function checkReading(id) {
  const r = READINGS.find(x => x.id === id);
  let score = 0;
  r.questions.forEach((q, i) => {
    const val = (document.getElementById('rq'+i)?.value || '').toLowerCase();
    if (val && q.a.toLowerCase().split('/').some(a => val.includes(a.trim()))) score++;
  });
  document.getElementById('readingResult').innerHTML = `<span class="text-green">Score: ${score}/${r.questions.length}</span>`;
  if (score === r.questions.length) addXP(15, 'Reading perfect');
  else addXP(5, 'Reading practice');
}

function renderWriting() {
  return `
    <h1>Writing</h1>
    <p class="text-dim mb-2">Prompts with checklists. Write in the box; self-check against the list.</p>
    ${WRITING.map(w => `
      <div class="card mb-2">
        <span class="badge ${badgeClass(w.level)}">${w.level}</span>
        <h4>${w.title}</h4>
        <p class="text-sm mb-1">${w.prompt}</p>
        <p class="text-sm text-dim">Checklist: ${w.checklist.join(' · ')}</p>
        <button class="btn btn-sm btn-primary" onclick="openWriting('${w.id}')">Write</button>
      </div>
    `).join('')}
  `;
}

function openWriting(id) {
  const w = WRITING.find(x => x.id === id);
  openModal(`
    <h2>${w.title}</h2>
    <p class="mb-1">${w.prompt}</p>
    <p class="text-sm text-dim mb-2">Checklist: ${w.checklist.join(' · ')}</p>
    <textarea id="writeArea" placeholder="Write here..."></textarea>
    <button class="btn btn-primary mt-2" onclick="addXP(10,'Writing practice'); toast('Saved locally — review your checklist!'); closeModal();">Done (+10 XP)</button>
    <button class="btn btn-ghost mt-2" onclick="closeModal()">Close</button>
  `);
}

function renderPronunciation() {
  return `
    <h1>Pronunciation</h1>
    <p class="text-dim mb-2">Key sounds, stress and connected speech. Use the speaker button to hear examples.</p>
    ${PRONUNCIATION.map(p => `
      <div class="card mb-2">
        <span class="badge ${badgeClass(p.level)}">${p.level}</span>
        <h4>${p.title}</h4>
        <pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:0.85rem;color:var(--text-dim)">${p.content}</pre>
        <button class="btn btn-sm btn-ghost mt-2" onclick="Speech.speak('Think three this mother')">🔊 TH practice</button>
      </div>
    `).join('')}
  `;
}

function renderPhrases() {
  const cats = [...new Set(PHRASES.map(p => p.cat))];
  return `
    <h1>Phrases</h1>
    <div class="filter-bar">
      <select id="phraseCat" onchange="filterPhrases()">
        <option value="">All categories</option>
        ${cats.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <div class="grid-2" id="phraseGrid">
      ${PHRASES.map(p => `
        <div class="card" data-cat="${p.cat}">
          <span class="badge ${badgeClass(p.level)}">${p.level}</span>
          ${p.formal ? '<span class="tag">formal</span>' : '<span class="tag">casual</span>'}
          <h4 class="mt-2">${p.en}</h4>
          <p class="text-dim">${p.pl}</p>
          <button class="btn btn-sm btn-ghost" onclick="Speech.speak('${p.en.replace(/'/g,"\\'")}')">🔊</button>
        </div>
      `).join('')}
    </div>
  `;
}

function filterPhrases() {
  const cat = document.getElementById('phraseCat')?.value || '';
  document.querySelectorAll('#phraseGrid .card').forEach(c => {
    c.style.display = !cat || c.dataset.cat === cat ? '' : 'none';
  });
}

function renderPhrasals() {
  return `
    <h1>Phrasal Verbs</h1>
    <p class="text-dim mb-2">High-frequency phrasal verbs with meaning and examples.</p>
    <div class="grid-2">
      ${PHRASALS.map(p => `
        <div class="card">
          <div class="flex justify-between">
            <h4 class="mono">${p.phrase}</h4>
            <span class="badge ${badgeClass(p.level)}">${p.level}</span>
          </div>
          <p>${p.meaning}</p>
          <div class="example">${p.example}</div>
          <p class="text-sm text-dim">${p.separable ? 'Separable' : 'Inseparable'}</p>
          <button class="btn btn-sm btn-ghost" onclick="Speech.speak('${p.phrase.replace(/'/g,"\\'")}')">🔊</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderIdioms() {
  return `
    <h1>Idioms</h1>
    <p class="text-dim mb-2">Common idioms with literal vs actual meaning.</p>
    <div class="grid-2">
      ${IDIOMS.map(i => `
        <div class="card">
          <span class="badge ${badgeClass(i.level)}">${i.level}</span>
          <h4 class="mt-2">${i.idiom}</h4>
          <p><strong>Meaning:</strong> ${i.meaning}</p>
          <p class="text-sm text-dim">Literal: ${i.literal}</p>
          <div class="example">${i.example}</div>
          <button class="btn btn-sm btn-ghost" onclick="Speech.speak('${i.idiom.replace(/'/g,"\\'")}')">🔊</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderQuizzes() {
  return `
    <h1>Quizzes</h1>
    <p class="text-dim mb-2">Standalone quizzes. Results are saved.</p>
    <div class="grid-2">
      ${QUIZZES.map(q => `
        <div class="card">
          <span class="badge ${badgeClass(q.level)}">${q.level}</span>
          <h4 class="mt-2">${q.title}</h4>
          <p class="text-sm text-dim">${q.questions.length} questions</p>
          <button class="btn btn-primary btn-sm" onclick="startStandaloneQuiz('${q.id}')">Start</button>
        </div>
      `).join('')}
    </div>
  `;
}

function startStandaloneQuiz(id) {
  const q = QUIZZES.find(x => x.id === id);
  if (!q) return;
  state.currentQuiz = { questions: q.questions, index: 0, score: 0, title: q.title };
  renderQuizEngine();
}

function renderFlashcards() {
  const words = VOCABULARY.slice(0, 40);
  if (!state.currentFlash) {
    state.currentFlash = { list: words.sort(() => Math.random() - 0.5), index: 0 };
  }
  const f = state.currentFlash;
  const w = f.list[f.index];
  if (!w) return '<p>No cards.</p>';
  return `
    <h1>Flashcards</h1>
    <p class="text-dim mb-2">Click the card to flip. Rate your recall.</p>
    <div class="flashcard" id="fc" onclick="this.classList.toggle('flipped')">
      <div class="flashcard-inner">
        <div class="flashcard-front">
          <div class="flashcard-word">${w.en}</div>
          <div class="flashcard-hint">Click to reveal</div>
        </div>
        <div class="flashcard-back">
          <div class="flashcard-word">${w.pl}</div>
          <p class="text-sm">${w.example}</p>
          <p class="ipa">${w.ipa || ''}</p>
        </div>
      </div>
    </div>
    <div class="flex gap-1 justify-between" style="max-width:400px;margin:1rem auto">
      <button class="btn btn-sm" style="background:#e63946" onclick="rateFlash('again')">Again</button>
      <button class="btn btn-sm" style="background:#e9c46a;color:#111" onclick="rateFlash('hard')">Hard</button>
      <button class="btn btn-sm" style="background:#2a9d8f" onclick="rateFlash('good')">Good</button>
      <button class="btn btn-sm" style="background:#457b9d" onclick="rateFlash('easy')">Easy</button>
    </div>
    <p class="text-center text-dim text-sm">${f.index + 1} / ${f.list.length}</p>
  `;
}

function rateFlash(rating) {
  const f = state.currentFlash;
  const w = f.list[f.index];
  state.user.flashProgress[w.id] = rating;
  if (rating === 'good' || rating === 'easy') {
    state.user.vocabProgress[w.id] = 'learned';
    addXP(2, 'Flashcard');
  }
  saveState();
  f.index++;
  if (f.index >= f.list.length) {
    f.index = 0;
    f.list = f.list.sort(() => Math.random() - 0.5);
    toast('Deck finished — shuffled again');
  }
  render();
}

function renderReview() {
  const recent = state.user.recentlyViewed.map(id => LESSONS.find(l => l.id === id)).filter(Boolean);
  const favs = state.user.favorites.map(id => VOCABULARY.find(v => v.id === id)).filter(Boolean);
  return `
    <h1>Review</h1>
    <h3>Recently viewed lessons</h3>
    <div class="grid-2 mb-3">
      ${recent.length ? recent.map(l => `
        <div class="card">
          <span class="badge ${badgeClass(l.level)}">${l.level}</span>
          <h4>${l.title}</h4>
          <button class="btn btn-sm btn-primary" onclick="openLesson('${l.id}')">Open</button>
        </div>
      `).join('') : '<p class="text-dim">No recent lessons yet.</p>'}
    </div>
    <h3>Favourite words</h3>
    <div class="grid-3">
      ${favs.length ? favs.map(v => vocabCard(v)).join('') : '<p class="text-dim">No favourites yet. Star words in Vocabulary.</p>'}
    </div>
  `;
}

function renderProgress() {
  const pct = getProgressPercent();
  const byLevel = LEVELS.map(l => {
    const total = LESSONS.filter(x => x.level === l).length;
    const done = LESSONS.filter(x => x.level === l && state.user.completedLessons[x.id]).length;
    return { l, total, done, pct: total ? Math.round(done/total*100) : 0 };
  });
  return `
    <h1>Progress</h1>
    <div class="card card-glow mb-3">
      <div class="flex justify-between"><span>Overall</span><span class="mono">${pct}%</span></div>
      <div class="progress-bar mt-2"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="text-sm text-dim mt-2">${Object.keys(state.user.completedLessons).length} lessons · ${state.user.xp} XP · Level ${state.user.level} · Streak ${state.user.streak}</p>
    </div>
    <h3>By CEFR level</h3>
    <div class="bar-chart mb-3">
      ${byLevel.filter(x => x.total).map(x => `
        <div class="bar" style="height:${Math.max(8, x.pct)}%" title="${x.l}: ${x.done}/${x.total}">
          <span>${x.l}</span>
        </div>
      `).join('')}
    </div>
    <div class="grid-2">
      ${byLevel.filter(x => x.total).map(x => `
        <div class="card">
          <div class="flex justify-between"><span class="badge ${badgeClass(x.l)}">${x.l}</span><span class="mono">${x.pct}%</span></div>
          <div class="progress-bar mt-2"><div class="progress-fill" style="width:${x.pct}%"></div></div>
          <p class="text-sm text-dim">${x.done}/${x.total} lessons</p>
        </div>
      `).join('')}
    </div>
  `;
}

function renderAchievements() {
  return `
    <h1>Achievements</h1>
    <div class="grid-3">
      ${ACHIEVEMENTS_DEF.map(a => {
        const unlocked = state.user.achievements.includes(a.id);
        return `<div class="card" style="${unlocked ? 'border-color:var(--yellow)' : 'opacity:0.5'}">
          <div style="font-size:2rem">${a.icon}</div>
          <h4>${a.title}</h4>
          <p class="text-sm text-dim">${a.desc}</p>
          ${unlocked ? '<span class="text-green text-sm">✓ Unlocked</span>' : '<span class="text-dim text-sm">Locked</span>'}
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderNative() {
  const nativeLessons = LESSONS.filter(l => l.level === 'Native');
  return `
    <h1>✦ Native Mode</h1>
    <p class="text-dim mb-2">Sound natural, not like a textbook. Contractions, fillers, real phrases, connected speech.</p>
    <div class="card mb-3" style="border-color:var(--accent)">
      <h3>Core idea</h3>
      <p>Natives prefer short, reduced, contextual language. Textbook sentences are often correct but unnatural in casual speech.</p>
      <div class="mistake">❌ How are you today?</div>
      <div class="example">✅ How's it going? / What's up? / How are you doing?</div>
      <div class="mistake">❌ I do not know.</div>
      <div class="example">✅ I dunno. / No idea. / Beats me.</div>
    </div>
    <h3>Native lessons</h3>
    <div class="grid-2">
      ${nativeLessons.map(l => `
        <div class="card">
          <span class="badge badge-native">Native</span>
          <h4>${l.title}</h4>
          <button class="btn btn-sm btn-primary" onclick="openLesson('${l.id}')">Open</button>
        </div>
      `).join('')}
    </div>
  `;
}

function renderSettings() {
  const s = state.user.settings;
  return `
    <h1>Settings</h1>
    <div class="card mb-2">
      <h3>Display</h3>
      <label class="flex items-center gap-1 mb-1">
        <input type="checkbox" id="setAnim" ${s.animations?'checked':''} onchange="updateSetting('animations', this.checked)">
        Animations
      </label>
      <label class="flex items-center gap-1 mb-1">
        <input type="checkbox" id="setCrt" ${s.crt?'checked':''} onchange="updateSetting('crt', this.checked)">
        CRT / scanline effect
      </label>
    </div>
    <div class="card mb-2">
      <h3>Speech</h3>
      <label>Speed: <input type="range" min="0.5" max="1.5" step="0.1" value="${s.speechSpeed}" onchange="updateSetting('speechSpeed', parseFloat(this.value))"></label>
    </div>
    <div class="card mb-2">
      <h3>Data</h3>
      <button class="btn btn-secondary btn-sm mb-1" onclick="exportProgress()">Export progress (JSON)</button>
      <button class="btn btn-secondary btn-sm mb-1" onclick="document.getElementById('importFile').click()">Import progress</button>
      <input type="file" id="importFile" accept=".json" class="hidden" onchange="importProgress(event)">
      <button class="btn btn-ghost btn-sm" style="color:var(--accent)" onclick="resetProgress()">Reset all progress</button>
    </div>
    <p class="text-sm text-dim">Interface language: Polish labels + English content. All data stays in your browser (localStorage).</p>
  `;
}

function updateSetting(key, val) {
  state.user.settings[key] = val;
  applySettings();
  saveState();
  toast('Setting saved');
}

function exportProgress() {
  const data = JSON.stringify(state.user, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'retro-english-progress.json';
  a.click();
  toast('Progress exported');
}

function importProgress(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      Object.assign(state.user, data);
      saveState();
      applySettings();
      updateTopBar();
      toast('Progress imported');
      render();
    } catch (err) { toast('Invalid file'); }
  };
  reader.readAsText(file);
}

function resetProgress() {
  if (!confirm('Reset ALL progress? This cannot be undone.')) return;
  state.user = {
    xp: 0, level: 1, cefr: 'A0', streak: 0, lastActive: null, dailyXP: 0, dailyGoal: 50,
    completedLessons: {}, quizScores: {}, vocabProgress: {}, flashProgress: {},
    favorites: [], bookmarked: [], recentlyViewed: [], achievements: [],
    settings: state.user.settings
  };
  saveState();
  updateTopBar();
  toast('Progress reset');
  render();
}

function renderSearch() {
  const q = state.searchQuery;
  if (!q) return '<p>Type at least 2 characters.</p>';
  const lessons = LESSONS.filter(l => l.title.toLowerCase().includes(q) || l.titlePl.toLowerCase().includes(q) || l.explanation.toLowerCase().includes(q));
  const grammar = GRAMMAR.filter(g => g.title.toLowerCase().includes(q) || g.explanation.toLowerCase().includes(q));
  const vocab = VOCABULARY.filter(v => v.en.includes(q) || v.pl.toLowerCase().includes(q));
  const phrases = PHRASES.filter(p => p.en.toLowerCase().includes(q) || p.pl.toLowerCase().includes(q));
  return `
    <h1>Search: “${q}”</h1>
    ${lessons.length ? `<h3>Lessons</h3><div class="grid-2 mb-2">${lessons.map(l => `
      <div class="card"><span class="badge ${badgeClass(l.level)}">${l.level}</span><h4>${l.title}</h4>
      <button class="btn btn-sm btn-primary" onclick="openLesson('${l.id}')">Open</button></div>`).join('')}</div>` : ''}
    ${grammar.length ? `<h3>Grammar</h3><div class="grid-2 mb-2">${grammar.map(g => `
      <div class="card" style="cursor:pointer" onclick="showGrammar('${g.id}')"><h4>${g.title}</h4></div>`).join('')}</div>` : ''}
    ${vocab.length ? `<h3>Vocabulary</h3><div class="grid-3 mb-2">${vocab.map(v => vocabCard(v)).join('')}</div>` : ''}
    ${phrases.length ? `<h3>Phrases</h3><div class="grid-2">${phrases.map(p => `
      <div class="card"><h4>${p.en}</h4><p class="text-dim">${p.pl}</p></div>`).join('')}</div>` : ''}
    ${!lessons.length && !grammar.length && !vocab.length && !phrases.length ? '<p class="text-dim">No results.</p>' : ''}
  `;
}

function randomLesson() {
  const undone = LESSONS.filter(l => !state.user.completedLessons[l.id]);
  const pool = undone.length ? undone : LESSONS;
  openLesson(pool[Math.floor(Math.random() * pool.length)].id);
}

function bindDynamicEvents() {
  // already using onclick in templates for simplicity and reliability
}

/* -------------------- INIT -------------------- */
function showWelcome() {
  document.getElementById('wLevel').textContent = state.user.cefr;
  document.getElementById('wProgress').textContent = getProgressPercent() + '%';
  document.getElementById('wXP').textContent = state.user.xp;
  document.getElementById('wStreak').textContent = '🔥 ' + state.user.streak;
}

function enterApp() {
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render();
}

document.getElementById('btnContinue').addEventListener('click', enterApp);
document.addEventListener('keydown', e => {
  if (!document.getElementById('welcomeScreen').classList.contains('hidden')) enterApp();
});

loadState();
showWelcome();
updateTopBar();
</script>
</body>
