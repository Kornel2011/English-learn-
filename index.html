<!DOCTYPE html>
<html lang="pl">
<head>

<title>RETRO ENGLISH — From Zero to Native</title>
<meta name="description" content="Kompletny kurs angielskiego A0-C2 + Native. Single-file, offline, GitHub Pages ready.">
<style>
:root{--bg:#0a0a0d;--bg2:#111118;--panel:#15151d;--panel2:#1c1c26;--line:#2a2a38;--txt:#e9e9ee;--mut:#9b9ba8;--red:#ff2b3e;--blue:#2fa9ff;--grn:#35e07a;--yel:#ffcf3d;--glowR:0 0 8px rgba(255,43,62,.6);--glowB:0 0 8px rgba(47,169,255,.55);--r:10px;--f:ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,'Courier New',monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation}
button,input,select,textarea{min-height:0}
.btn,.nbtn,.opt,.fcard{touch-action:manipulation}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(800px 400px at 20% -5%,rgba(255,43,62,.12),transparent),radial-gradient(800px 400px at 90% 10%,rgba(47,169,255,.12),transparent),radial-gradient(600px 600px at 50% 110%,rgba(255,43,62,.06),transparent);pointer-events:none;z-index:0;animation:bgFloat 14s ease-in-out infinite alternate}
@keyframes bgFloat{to{transform:translateY(-14px)}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#crt{position:fixed;inset:0;pointer-events:none;z-index:61;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%);display:block}
body.no-crt #crt,body.no-crt #scan{display:none}
body.no-anim *{animation:none!important;transition:none!important}
a{color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(10,10,13,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:1px;font-size:18px;text-shadow:var(--glowR)}
.logo span{color:var(--red)}.logo em{color:var(--blue);font-style:normal;text-shadow:var(--glowB)}
.cursor{display:inline-block;width:10px;height:18px;background:var(--red);vertical-align:-3px;margin-left:6px;animation:blink 1s steps(1) infinite;box-shadow:var(--glowR)}
@keyframes blink{50%{opacity:0}}
#ham{display:none;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:inherit;cursor:pointer}
#layout{display:flex;min-height:calc(100vh - 53px);position:relative;z-index:1}
aside{width:248px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);padding:12px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
aside nav{display:flex;flex-direction:column;gap:4px}
.nbtn{display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;color:var(--txt);padding:9px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s}
.nbtn:hover{background:var(--panel2);border-color:var(--line);transform:translateX(2px)}
.nbtn.on{background:linear-gradient(90deg,rgba(255,43,62,.18),rgba(47,169,255,.14));border-color:var(--red);box-shadow:var(--glowR)}
.nbtn .e{width:22px;text-align:center}
main{flex:1;padding:18px;max-width:1150px;margin:0 auto;width:100%}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 4px 24px rgba(0,0,0,.4);transition:.2s}
.card:hover{border-color:#3a3a4e}
.card h2,.card h3{margin:0 0 8px}.lvl{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--blue);color:var(--blue);margin-right:6px}
.lvl.A0,.lvl.A1{background:rgba(53,224,122,.12);color:var(--grn);border-color:var(--grn)}
.lvl.A2,.lvl.B1{background:rgba(47,169,255,.12)}
.lvl.B2,.lvl.C1{background:rgba(255,207,61,.12);color:var(--yel);border-color:var(--yel)}
.lvl.C2,.lvl.NAT{background:rgba(255,43,62,.14);color:var(--red);border-color:var(--red)}
.btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:var(--glowR);transition:.15s;min-height:44px}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn:active{transform:none}
.btn.b{background:var(--blue);box-shadow:var(--glowB)}.btn.g{background:#22232e;color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;min-height:40px}.btn:disabled{opacity:.5;cursor:default}
.nbtn{min-height:44px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#0e0e14;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{font-size:22px;display:block}.kpi small{color:var(--mut)}
.bar{height:10px;background:#0c0c12;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));box-shadow:var(--glowR);transition:width .8s ease;border-radius:20px}
.tag{display:inline-block;background:#0e0e14;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--mut);margin:2px}
input,select,textarea{background:#0d0d13;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-family:inherit;width:100%;font-size:16px;min-height:44px}
textarea{min-height:96px}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.tscroll table{min-width:480px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}th{color:var(--mut)}
img,video{max-width:100%;height:auto}
p,h1,h2,h3{overflow-wrap:anywhere}
.flash{perspective:800px;max-width:520px;margin:0 auto}.fcard{background:#0e0e15;border:2px solid var(--red);border-radius:14px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;padding:24px;text-align:center;font-size:22px;box-shadow:var(--glowR);transition:transform .25s;user-select:none;-webkit-user-select:none}
.fcard small{font-size:13px;color:var(--mut);margin-top:10px}
.quizQ{margin-bottom:12px}.opt{display:block;width:100%;text-align:left;margin:6px 0;background:#0e0e15;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:12px;cursor:pointer;font-family:inherit;min-height:48px;font-size:15px}
.opt:hover{border-color:var(--blue)}.opt.ok{border-color:var(--grn);background:rgba(53,224,122,.12)}.opt.bad{border-color:var(--red);background:rgba(255,43,62,.12)}
#toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 24px))}
.toast{background:#101018;border:1px solid var(--red);border-left:4px solid var(--red);border-radius:8px;padding:10px 14px;box-shadow:var(--glowR);animation:tin .25s ease}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:98;padding:16px}
#modal{background:var(--panel);border:1px solid var(--red);border-radius:12px;max-width:560px;width:100%;padding:20px;box-shadow:var(--glowR);max-height:calc(90dvh - env(safe-area-inset-bottom));overflow:auto}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65;display:none}
#overlay.show{display:block}
#mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:66;background:rgba(13,13,19,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
#mnav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
#mnav button{background:transparent;border:1px solid transparent;color:var(--txt);border-radius:10px;font-family:inherit;font-size:11px;padding:8px 2px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#mnav button span{font-size:19px}
#mnav button.on{border-color:var(--red);background:rgba(255,43,62,.12)}
.ach{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.ex{background:#0c0c12;border-left:3px solid var(--blue);padding:8px 10px;margin:6px 0;border-radius:0 8px 8px 0}
.warn{background:#0c0c12;border-left:3px solid var(--red);padding:8px 10px;margin:6px 0;border-radius:0 8px 8px 0}
.cefr{display:flex;gap:6px;flex-wrap:wrap}.cefr div{flex:1;min-width:90px;text-align:center;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0d0d13}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bad2{background:rgba(255,43,62,.08);border:1px solid var(--red);border-radius:8px;padding:10px}.good2{background:rgba(53,224,122,.08);border:1px solid var(--grn);border-radius:8px;padding:10px}
footer{color:var(--mut);text-align:center;padding:18px;font-size:12px}
kbd{background:#22232e;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g2,.two{grid-template-columns:1fr}}
@media(max-width:600px){.g2,.g3,.g4,.two{grid-template-columns:1fr}.card{padding:14px}main{padding:12px;padding-bottom:92px}.row .btn{flex:1 1 140px}table{font-size:13px}.fcard{font-size:19px;min-height:200px}}
@media(max-width:760px){aside{position:fixed;left:0;top:0;z-index:70;transform:translateX(-105%);transition:transform .22s ease;height:100dvh;width:min(300px,86vw);box-shadow:8px 0 30px rgba(0,0,0,.5);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}aside.open{transform:none}#ham{display:block}main{padding:12px;padding-bottom:92px}header{flex-wrap:wrap;row-gap:6px;padding:8px 10px}.logo{font-size:15px}.logo small{display:none}#mnav{display:block}#toasts{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:none}}
</style>
</head>
<body>
<div id="scan"></div><div id="crt"></div>
<header>
<button id="ham" aria-label="Menu">☰ MENU</button>
<div class="logo"><span>RETRO</span> <em>ENGLISH</em> <small style="color:var(--mut);font-size:11px">v2.0 // FROM ZERO TO NATIVE</small><span class="cursor"></span></div>
<div style="margin-left:auto" class="row">
<span id="hdrXP" class="tag">0 XP</span><span id="hdrStreak" class="tag">🔥 0</span><span id="hdrLvl" class="tag">A0</span>
</div>
</header>
<div id="layout">
<aside id="side" aria-label="Nawigacja"><nav id="nav"></nav></aside>
<main id="app" tabindex="-1"></main>
</div>
<div id="overlay"></div>
<nav id="mnav" aria-label="Nawigacja mobilna"><div class="in" id="mnavIn"></div></nav>
<div id="toasts" aria-live="polite"></div>
<div id="modalWrap"><div id="modal" role="dialog" aria-modal="true"></div></div>
<footer>RETRO ENGLISH · single-file · offline · GitHub Pages ready · Web Speech API opcjonalnie · dane tylko w localStorage</footer>
<script>
"use strict";
/* ============ 1. STATE / STORAGE ============ */
const LS="retroEnglishV1";
const DEF={xp:0,completed:[],bookmarks:[],recent:[],favVoc:[],learnedVoc:[],flash:{},quizScores:[],mistakes:[],ach:[],streak:0,lastVisit:"",dailyXP:0,dailyDay:"",xpHist:{},set:{anim:true,crt:true,sound:false,speed:1,accent:"red",ui:"pl"},level:"A0"};
let S; try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(LS)||"{}"));S.set=Object.assign({},DEF.set,S.set||{});}catch(e){S={...DEF,set:{...DEF.set}};}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} updHdr();}
function todayStr(){return new Date().toISOString().slice(0,10);}
function touchDay(){const t=todayStr();if(S.dailyDay!==t){S.dailyDay=t;S.dailyXP=0;}if(S.lastVisit!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=(S.lastVisit===y)?(S.streak||0)+1:1;S.lastVisit=t;}save();}
/* ============ 2. COURSE DATA ============ */
/* Każda lekcja: id, level, title, expl, examples, vocab[[en,pl]], mistakes, task{q,a}, quiz[{t,q,o,a,exp}] t: choice|blank|order */
const LESSONS=[
{id:"A0-1",level:"A0",title:"Alphabet & Spelling",expl:"Alfabet angielski ma 26 liter. Litery wymawiamy inaczej niż w polskim. Do literowania używaj: 'How do you spell it? I-T'. Samogłoski: A E I O U. Wyrazy z wielkiej litery: imiona, kraje, dni, miesiące.",examples:["My name is Anna. A-N-N-A.","Spell 'cat': C-A-T.","A for Apple, B for Ball."],vocab:[["letter","litera"],["spell","literować"],["alphabet","alfabet"],["name","imię"],["how","jak"]],mistakes:["Nie czytaj liter po polsku: 'C' to /siː/, nie 'ce'."],task:{q:"Przeliteruj swoje imię po angielsku (np. K-U-B-A).",a:"kuba"},quiz:[{t:"choice",q:"Jak wymawiasz literę 'H'?",o:["/heɪtʃ/ (ejcz)","/ha/","/achy/"],a:0},{t:"blank",q:"Uzupełnij: How do you ___ it? (spell)",a:"spell"},{t:"choice",q:"Ile liter ma alfabet angielski?",o:["26","24","30"],a:0}]},
{id:"A0-2",level:"A0",title:"Hello, Goodbye, Please, Thanks",expl:"Podstawowe zwroty: Hello/Hi (cześć), Good morning (do ~12:00), Good evening (po 17:00), Goodbye/Bye, Please (proszę), Thank you / Thanks, Sorry / Excuse me. 'Good night' = dobranoc (na pożegnanie wieczorem), nie powitanie.",examples:["Hello! My name is Tom.","Good morning, class!","Thank you very much.","See you later!"],vocab:[["hello","cześć"],["goodbye","do widzenia"],["please","proszę"],["thank you","dziękuję"],["sorry","przepraszam"]],mistakes:["Nie mów 'Good night' na dzień dobry."],task:{q:"Napisz 2 powitania: rano i wieczorem.",a:"good morning"},quiz:[{t:"choice",q:"Co powiesz rano?",o:["Good morning","Good night","Goodbye"],a:0},{t:"blank",q:"___ you! (= dziękuję)",a:"thank"}]},
{id:"A0-3",level:"A0",title:"Numbers 0–100",expl:"0 zero / ou, 11 eleven, 12 twelve, 13 thirteen... 20 twenty, 30 thirty, 40 forty. 21 = twenty-one. Liczby złożone łączymy myślnikiem. Telefon: mów cyfra po cyfrze, 0 = 'oh'.",examples:["I am twelve years old.","My number is five-oh-three.","Thirty-five students."],vocab:[["one","jeden"],["twelve","dwanaście"],["twenty","dwadzieścia"],["hundred","sto"],["number","numer"]],mistakes:["'fourty' jest błędne — poprawnie 'forty'."],task:{q:"Napisz słownie: 47",a:"forty-seven"},quiz:[{t:"choice",q:"Jak jest 15?",o:["fifteen","fifty","five"],a:0},{t:"blank",q:"20 = ___",a:"twenty"}]},
{id:"A0-4",level:"A0",title:"Colors, Days, Months",expl:"Kolory: red, blue, green... Dni i miesiące ZAWSZE z wielkiej litery: Monday, January. Pytania: 'What's your favourite colour?' 'What day is it today?'",examples:["My favourite colour is blue.","Today is Friday.","My birthday is in May."],vocab:[["red","czerwony"],["blue","niebieski"],["Monday","poniedziałek"],["January","styczeń"],["favourite","ulubiony"]],mistakes:["Nie pisz 'monday' małą literą."],task:{q:"What day is it today? (po angielsku)",a:"monday"},quiz:[{t:"choice",q:"Który zapis poprawny?",o:["Monday","monday","MONday"],a:0},{t:"blank",q:"My favourite ___ is red. (colour)",a:"colour"}]},
{id:"A0-5",level:"A0",title:"To be + Pronouns + a/an",expl:"I am, you are, he/she/it is, we/you/they are. 'a' przed spółgłoską, 'an' przed samogłoską: a cat, an apple. Szyk: Podmiot + be + reszta. Pytanie: inwersja (Are you...?).",examples:["I am Polish.","She is a teacher.","Is he happy?","It is an orange."],vocab:[["I","ja"],["you","ty"],["he","on"],["she","ona"],["teacher","nauczyciel"]],mistakes:["Nie mów 'I is' — tylko 'I am'.","Nie mów 'a apple' — tylko 'an apple'."],task:{q:"Uzupełnij: She ___ happy. (is)",a:"is"},quiz:[{t:"choice",q:"Wybierz poprawne:",o:["She is happy.","She are happy.","She am happy."],a:0},{t:"choice",q:"___ apple (poprawny przedimek)",o:["an","a","thee"],a:0},{t:"blank",q:"They ___ students. (are)",a:"are"}]},
{id:"A1-1",level:"A1",title:"Present Simple",expl:"Czynności rutynowe i fakty. Formula: S + V(s). He/She/It + -s: he works. Przeczenia: don't/doesn't. Pytania: Do/Does + S + V?",examples:["I work every day.","She likes coffee.","Do you play football?","He doesn't watch TV."],vocab:[["every day","codziennie"],["usually","zwykle"],["work","pracować"],["like","lubić"],["coffee","kawa"]],mistakes:["'He go' → 'He goes'.","W pytaniu bez -s: 'Does he work?' nie 'Does he works?'"],task:{q:"Napisz zdanie z 'She' + 'play'.",a:"she plays"},quiz:[{t:"choice",q:"She ___ to school.",o:["goes","go","going"],a:0},{t:"choice",q:"___ he like pizza?",o:["Does","Do","Is"],a:0},{t:"blank",q:"They ___ (not/work) on Sundays. → don't work",a:"don't work"}]},
{id:"A1-2",level:"A1",title:"Present Continuous",expl:"Czynność TERAZ / tymczasowa. Formula: be + V-ing. I am eating. Pisownia: make→making, run→running. Signal words: now, at the moment, currently.",examples:["I am reading now.","Look! It is raining.","Are you working today?"],vocab:[["now","teraz"],["read","czytać"],["rain","padać"],["look","patrz"],["listen","słuchać"]],mistakes:["Nie: 'I am read' → 'I am reading'.","Stative verbs (like, know) zwykle NIE w -ing."],task:{q:"Zbuduj: I / eat / now.",a:"i am eating now"},quiz:[{t:"choice",q:"Look! She ___ .",o:["is coming","comes","come"],a:0},{t:"blank",q:"They ___ playing football now. (are)",a:"are"}]},
{id:"A1-3",level:"A1",title:"Past Simple (regular + be)",expl:"Przeszłość dokonana. Regularne: V+ed (worked, visited). was/were dla 'be'. Did w pytaniach/przeczeniach + bezokolicznik. Signal: yesterday, last week, in 2010.",examples:["I visited Kraków yesterday.","She was tired.","Did you watch the match?","We didn't go out."],vocab:[["yesterday","wczoraj"],["last","ostatni"],["visit","odwiedzać"],["watch","oglądać"],["tired","zmęczony"]],mistakes:["'Did you went?' → 'Did you go?'"],task:{q:"Past Simple od 'go'?",a:"went"},quiz:[{t:"choice",q:"I ___ TV last night.",o:["watched","watch","watchedded"],a:0},{t:"choice",q:"___ you happy yesterday?",o:["Were","Was","Are"],a:0},{t:"blank",q:"She didn't ___ (come).",a:"come"}]},
{id:"A1-4",level:"A1",title:"will + going to + can/must/should",expl:"will = spontaniczna decyzja/obietnica (I'll help!). going to = plan/zamiar (I'm going to study). can = umieć/móc, must = musieć, should = radzić. Po modalach bez 'to': can go, must stay.",examples:["I'll open the window.","We're going to travel in July.","You should drink water.","You mustn't smoke here."],vocab:[["will","będę (czas przyszły)"],["plan","plan"],["help","pomagać"],["must","musieć"],["advice","rada"]],mistakes:["Nie: 'I will to go' → 'I will go'.","Nie: 'cans' — modale bez -s."],task:{q:"Ułóż obietnicę z I'll.",a:"i'll"},quiz:[{t:"choice",q:"___ you swim?",o:["Can","Cans","To can"],a:0},{t:"choice",q:"You look tired. You ___ rest.",o:["should","must to","should to"],a:0}]},
{id:"A1-5",level:"A1",title:"there is/are, some/any, much/many",expl:"there is (l.poj) / there are (l.mn). some w twierdzeniach, any w pytaniach/przeczeniach. much + niepoliczalne, many + policzalne. a lot of = oba.",examples:["There is a cat in the garden.","Are there any shops here?","How many apples? How much milk?"],vocab:[["there","tam (konstrukcja)"],["some","trochę / jakieś"],["any","żadne / jakieś"],["many","wiele"],["much","dużo"]],mistakes:["'There is many people' → 'There are many people'."],task:{q:"___ there any milk? (Is/Are)",a:"is"},quiz:[{t:"choice",q:"___ there a bank near here?",o:["Is","Are","Do"],a:0},{t:"choice",q:"How ___ water do you drink?",o:["much","many","some"],a:0}]},
{id:"A2-1",level:"A2",title:"Past Continuous + used to",expl:"Past Continuous: was/were + V-ing — tło akcji w przeszłości (While I was cooking, he called). used to = kiedyś regularnie, już nie (I used to play).",examples:["I was sleeping at 10 pm.","While she was driving, it started to rain.","I used to live in Gdańsk."],vocab:[["while","podczas gdy"],["suddenly","nagle"],["used to","kiedyś (zwyczaj)"],["cook","gotować"],["drive","prowadzić"]],mistakes:["used to + bezokolicznik, nie -ing."],task:{q:"Napisz: I ___ (sleep) at midnight yesterday.",a:"was sleeping"},quiz:[{t:"choice",q:"At 8 pm yesterday I ___ dinner.",o:["was cooking","cook","have cooked"],a:0},{t:"choice",q:"She ___ play chess.",o:["used to","use to","is used to play"],a:0}]},
{id:"A2-2",level:"A2",title:"Present Perfect",expl:"have/has + V3. Skutek teraz / doświadczenie (ever/never, just, already, yet, since/for). Present Perfect vs Past Simple: 'I have lost my keys (=nie mam)' vs 'I lost them yesterday (=kiedy)'.",examples:["I have just eaten.","Have you ever been to London?","She has lived here since 2020."],vocab:[["just","właśnie"],["already","już"],["ever","kiedykolwiek"],["since","od"],["experience","doświadczenie"]],mistakes:["Nie używaj czasu przeszłego z 'just/already' + konkretny czas."],task:{q:"V3 od 'go'?",a:"gone"},quiz:[{t:"choice",q:"I ___ finished my homework.",o:["have just","just have","did just"],a:0},{t:"choice",q:"She has lived here ___ 2019.",o:["since","for","from"],a:0},{t:"blank",q:"Have you ___ been to the USA? (ever)",a:"ever"}]},
{id:"A2-3",level:"A2",title:"First Conditional + Future forms",expl:"First Conditional: If + Present Simple, will + V (If it rains, we'll stay). Future: will (decyzja), going to (plan), Present Continuous (umówione), Present Simple (rozkład).",examples:["If you study, you'll pass.","We're meeting at 6 pm tomorrow.","The train leaves at 7."],vocab:[["if","jeśli"],["unless","chyba że"],["pass","zdać"],["meet","spotkać"],["leave","odjeżdżać"]],mistakes:["Po 'if' NIE dajemy 'will': If you will come → If you come."],task:{q:"If it rains, we ___ (stay).",a:"will stay"},quiz:[{t:"choice",q:"If you hurry, you ___ the bus.",o:["will catch","catch","would catch"],a:0}]},
{id:"A2-4",level:"A2",title:"Phrasal verbs & modals basics",expl:"Phrasal verb = czasownik + partykuła (get up, look for). Znaczenia idiomatyczne. Modale: have to (konieczność z zewnątrz), don't have to (nie musisz), mustn't (zakaz).",examples:["I get up at 7.","Please look after my cat.","You don't have to come.","You mustn't park here."],vocab:[["get up","wstawać"],["look for","szukać"],["look after","opiekować się"],["have to","musieć"],["mustn't","nie wolno"]],mistakes:["'mustn't' ≠ 'don't have to'."],task:{q:"'Opiekować się' to look ___.",a:"after"},quiz:[{t:"choice",q:"'look for' znaczy:",o:["szukać","opiekować się","odwiedzać"],a:0},{t:"choice",q:"You ___ pay — it's free.",o:["don't have to","mustn't","have to"],a:0}]},
{id:"B1-1",level:"B1",title:"Past Perfect + Narratives",expl:"Past Perfect: had + V3 — 'wcześniejsza przeszłość'. When I arrived, the film had started. Past Perfect Continuous: had been + V-ing (How long had you been waiting?). Narracja: linking words (then, suddenly, however).",examples:["She had never seen snow before.","I'd been waiting for an hour.","Suddenly, the lights went out."],vocab:[["before","wcześniej"],["already","już"],["suddenly","nagle"],["narrative","opowieść"],["wait","czekać"]],mistakes:["Nie używaj Past Perfect bez punktu odniesienia w przeszłości."],task:{q:"When I arrived, they ___ (leave). → had left",a:"had left"},quiz:[{t:"choice",q:"I was hungry — I ___ eaten.",o:["hadn't","haven't","didn't had"],a:0}]},
{id:"B1-2",level:"B1",title:"Second Conditional + wishes",expl:"Nierealne teraz/przyszłość: If + Past Simple, would + V. If I were rich, I'd travel. wish + past: I wish I knew. 'were' dla wszystkich osób w formalnym stylu.",examples:["If I had time, I'd help.","I wish it were Friday.","If I were you, I'd study."],vocab:[["wish","życzyć/pragnąć"],["rich","bogaty"],["would","by (tryb)"],["unreal","nierealny"],["advice","rada"]],mistakes:["Nie: If I would have → If I had."],task:{q:"If I ___ (be) you, I'd go.",a:"were"},quiz:[{t:"choice",q:"If I won the lottery, I ___ travel.",o:["would","will","can"],a:0}]},
{id:"B1-3",level:"B1",title:"Passive + Reported Speech",expl:"Passive: be + V3 (The bridge was built in 1900). Reported: 'I am tired' → He said he was tired. Cofnięcie czasów, say vs tell (tell + osoba).",examples:["English is spoken here.","He said (that) he was busy.","She told me to wait."],vocab:[["build","budować"],["say","mówić"],["tell","powiedzieć komuś"],["report","relacjonować"],["busy","zajęty"]],mistakes:["'He said me' → 'He told me / He said to me'."],task:{q:"Zamień: 'I like tea' → He said he ___ tea.",a:"liked"},quiz:[{t:"choice",q:"The letter ___ yesterday.",o:["was sent","sent","is sent yesterday"],a:0},{t:"choice",q:"She ___ me the truth.",o:["told","said","sayed"],a:0}]},
{id:"B1-4",level:"B1",title:"Gerund vs Infinitive",expl:"Gerund (V-ing) po: enjoy, mind, avoid, can't stand, look forward to. Infinitive (to V) po: want, decide, promise, plan. Niektóre oba ze zmianą znaczenia: stop smoking (=rzucić) vs stop to smoke (=zatrzymać się, by zapalić).",examples:["I enjoy swimming.","She decided to leave.","I look forward to meeting you."],vocab:[["enjoy","cieszyć się"],["avoid","unikać"],["decide","decydować"],["promise","obiecywać"],["mind","mieć coś przeciwko"]],mistakes:["'look forward to meeting', nie 'to meet'."],task:{q:"I enjoy ___ (read).",a:"reading"},quiz:[{t:"choice",q:"She promised ___ on time.",o:["to be","being","be"],a:0},{t:"choice",q:"Avoid ___ late.",o:["being","to be","be"],a:0}]},
{id:"B2-1",level:"B2",title:"Mixed & Advanced Conditionals",expl:"Mixed: przeszłość → teraźniejszość (If you'd studied, you'd have a job now). Inversion: Had I known..., Should you need..., Were I rich... Cleft: It was John who called. Emphasis dla formalności.",examples:["Had I known, I'd have come.","Were she here, she'd help.","It was yesterday that we met."],vocab:[["otherwise","w przeciwnym razie"],["regret","żałować"],["inversion","inwersja"],["emphasis","nacisk"],["provided","pod warunkiem"]],mistakes:["Mieszanie czasów bez logiki czasowej."],task:{q:"Had I known = ___ I had known.",a:"if"},quiz:[{t:"choice",q:"___ I known, I would have helped.",o:["Had","If had","Would"],a:0}]},
{id:"B2-2",level:"B2",title:"Advanced Passive & Reported",expl:"Passive z modalami (must be done), have sth done (I had my hair cut), reporting verbs (deny, admit, suggest + gerund). Formal: It is believed that... Nuance: seem/appear.",examples:["The car needs to be washed.","She denied taking the money.","It is said that he is rich."],vocab:[["deny","zaprzeczać"],["admit","przyznawać"],["suggest","sugerować"],["believe","wierzyć"],["need","potrzebować"]],mistakes:["'suggest me' → 'suggest (that) I...' / 'suggest going'."],task:{q:"I had my car ___ (repair).",a:"repaired"},quiz:[{t:"choice",q:"She denied ___ the keys.",o:["taking","to take","take"],a:0}]},
{id:"B2-3",level:"B2",title:"Collocations & Formal/Informal",expl:"Kolokacje: make a decision, do homework, heavy rain, take responsibility. Formal: purchase (buy), commence (start), reside (live). Rejestr ma znaczenie na egzaminach i w pracy.",examples:["Make progress, not *do progress.","Could you please confirm receipt?","Thanks a lot! vs I appreciate it."],vocab:[["make a decision","podjąć decyzję"],["heavy rain","ulewa"],["purchase","kupować (formalnie)"],["confirm","potwierdzać"],["receipt","odbiór"]],mistakes:["'do a mistake' → 'make a mistake'."],task:{q:"___ a mistake (make/do)?",a:"make"},quiz:[{t:"choice",q:"Poprawna kolokacja:",o:["make progress","do progress","make progressing"],a:0}]},
{id:"C1-1",level:"C1",title:"Academic & Sophisticated Structures",expl:"Nominalizacja (develop → development), złożone zdania podrzędne, hedging (tends to, arguably, somewhat), cohesive devices (moreover, notwithstanding, albeit). Strona bierna i bezosobowa w esejach.",examples:["The implementation of the policy led to...","Arguably, this trend is reversible.","Notwithstanding the costs, ..."],vocab:[["moreover","ponadto"],["however","jednakże"],["arguably","prawdopodobnie"],["trend","trend"],["implement","wdrażać"]],mistakes:["Zbyt potoczne słownictwo w esejach formalnych."],task:{q:"Podaj formalny synonim 'but' na początek zdania.",a:"however"},quiz:[{t:"choice",q:"Najbardziej formalne:",o:["Moreover","Plus","And so"],a:0}]},
{id:"C1-2",level:"C1",title:"Nuance, Register & Idioms",expl:"Niuanse: slim/slender/skinny, persuade/convince. Rejestr: kids (neutral) / offspring (formal) / brats (slang, obraźliwe). Idiomy C1: 'the tip of the iceberg', 'go the extra mile'. Metafory idevices retoryczne.",examples:["He went the extra mile.","It's just the tip of the iceberg.","Her argument was compelling."],vocab:[["compelling","przekonujący"],["nuance","niuans"],["register","rejestr"],["slender","szczupły"],["iceberg","góra lodowa"]],mistakes:["Używanie idiomów dosłownie / w złym rejestrze."],task:{q:"'Tip of the ___'?",a:"iceberg"},quiz:[{t:"choice",q:"'Go the extra mile' znaczy:",o:["dać z siebie więcej","iść na spacer","uciekać"],a:0}]},
{id:"C2-1",level:"C2",title:"Subtle Grammar & Paraphrasing",expl:"Subtelności: 'I used to' vs 'I'm used to' vs 'I would'. Future Perfect Continuous (By 2030 I'll have been working...). Parafraza: przekształcanie bez zmiany znaczenia — klucz na CPE. Elipsa i inwersja stylistyczna.",examples:["By June, I'll have been living here for 10 years.","Rarely had we seen such chaos.","Little did he know..."],vocab:[["paraphrase","parafraza"],["elipsis","elipsa"],["rarely","rzadko"],["chaos","chaos"],["subtle","subtelny"]],mistakes:["Mylenie 'used to do' z 'be used to doing'."],task:{q:"I'm used to ___ (get up) early. → getting up",a:"getting up"},quiz:[{t:"choice",q:"Little ___ he know.",o:["did","does","hadn't"],a:0}]},
{id:"C2-2",level:"C2",title:"Irony, Tone & Implied Meaning",expl:"Ironia, sarkazm, understatement (British: 'Not bad' = bardzo dobre), implikatury. Rozpoznawanie tonu: detached, ironic, approving. Teksty literackie i prasowe.",examples:["'Great, another delay. Just what I needed.' (ironia)","'I guess that went well... not.' (sarkazm)","The report merely hints at the crisis. (implied)"],vocab:[["irony","ironia"],["sarcasm","sarkazm"],["imply","sugerować"],["tone","ton"],["understatement","niedopowiedzenie"]],mistakes:["Branie ironii dosłownie w reading."],task:{q:"'Not bad' po brytyjsku często znaczy ___ (bardzo dobre).",a:"very good"},quiz:[{t:"choice",q:"'Oh fantastic, rain again!' To:",o:["ironia","entuzjazm","prośba"],a:0}]},
{id:"NAT-1",level:"NAT",title:"Sound Natural: Textbook vs Real",expl:"Natives skracają i zmiękczają. Textbook: 'How are you today?' Natural: 'How's it going? / How've you been?' 'I am going to' → 'I'm gonna'. Fillery: well, like, you know, I mean. Nie tłumacz dosłownie z polskiego.",examples:["❌ I am fine, and you? → ✅ Pretty good, you?","❌ Give me salt → ✅ Could you pass the salt?","❌ I have 20 years → ✅ I'm 20."],vocab:[["gonna","zamierzam (pot.)"],["wanna","chcę (pot.)"],["kinda","trochę"],["you know","wiesz"],["I mean","mam na myśli"]],mistakes:["Kalki: 'I learn to exam' → 'I'm studying for an exam'.","'Actually' ≠ 'aktualnie' (actually = w rzeczywistości)."],task:{q:"Naturalnie: 'How ___ it going?'",a:"'s"},quiz:[{t:"choice",q:"Najbardziej naturalne:",o:["How's it going?","How are you today, sir?","What is your state?"],a:0},{t:"blank",q:"I'm ___ (gonna) grab a coffee.",a:"gonna"}]},
{id:"NAT-2",level:"NAT",title:"Connected Speech & US vs UK",expl:"Redukcje: going to→gonna, want to→wanna, got to→gotta, kind of→kinda. Linking: 'cup_of tea'. US: 'What's up? / Awesome!'. UK: 'Cheers! / Lovely! / Brilliant!'. Intonacja i rytm ważniejsze niż pojedyncze dźwięki.",examples:["Whaddaya want? (= What do you want?)","D'jeet yet? (= Did you eat yet?) [US casual]","Fancy a cuppa? [UK]"],vocab:[["cheers","dzięki / na zdrowie (UK)"],["awesome","super (US)"],["cuppa","filiżanka herbaty"],["mate","kumpel"],["gonna","będę (pot.)"]],mistakes:["Przesadne 'r' w UK RP lub brak w US — wybierz jeden akcent i bądź konsekwentny."],task:{q:"'Fancy a ___?' (cuppa)",a:"cuppa"},quiz:[{t:"choice",q:"'Wanna' pochodzi od:",o:["want to","was not","went"],a:0}]}
];

/* ---- QUIZ ENGINE v2 ---- */
/* Typy: choice | blank | order | translate | correct | tf */
function norm(s){return String(s??"").toLowerCase().trim().replace(/\s+/g," ").replace(/[.,!?;:'"()]/g,"").trim();}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const TYPE_LABEL={choice:"Multiple choice",blank:"Fill in the blank",order:"Word order",translate:"Translation",correct:"Correct the sentence",tf:"True / False"};
function tLabel(t){return TYPE_LABEL[t]||t;}
function renderQuiz(el,qs,ctx,opts){opts=opts||{};if(!qs||!qs.length){el.innerHTML="<p>Brak pytań dla tych filtrów. Zmień poziom/typ.</p>";return;}
if(opts.shuffle!==false)qs=shuffle(qs.map(q=>({...q})));
if(opts.count)qs=qs.slice(0,opts.count);
let i=0,score=0,log=[],tLeft=opts.timed||0,timer=null;
function stopT(){if(timer){clearInterval(timer);timer=null;}}
function show(){if(tLeft&&!timer&&i<qs.length){timer=setInterval(()=>{tLeft--;const e=el.querySelector("#qtime");if(e)e.textContent="⏱ "+tLeft+"s";if(tLeft<=0){stopT();finish(true);}},1000);}
if(i>=qs.length){finish(false);return;}
const q=qs[i];const pctM=Math.round(100*i/qs.length);
let h=`<div class="bar" style="margin-bottom:10px"><i style="width:${pctM}%"></i></div><div class="quizQ"><b>Q${i+1}/${qs.length}</b> ${q.cat?`<span class="tag">${esc(q.cat)}</span>`:""} ${q.level?`<span class="lvl ${q.level}">${q.level}</span>`:""} ${tLeft?`<span class="tag" id="qtime">⏱ ${tLeft}s</span>`:""}<br><div style="font-size:16px;margin:4px 0">${esc(q.q)}</div>${q.hint?`<small style="color:var(--mut)">💡 ${esc(q.hint)}</small>`:""}<br><small style="color:var(--mut)">${tLabel(q.t)}</small><div style="margin-top:8px">`;
if(q.t==="blank"||q.t==="translate"){h+=`<div class="row"><input id="qa" enterkeyhint="done" placeholder="${q.t==="translate"?"Przetłumacz na angielski...":"Wpisz odpowiedź..."}" style="max-width:320px"><button class="btn sm b" id="qok">Check ✓</button><button class="btn sm g" id="qskip">Skip →</button></div>`;}
else if(q.t==="order"){const words=shuffle(q.o);h+=`<p style="color:var(--mut)">Ułóż zdanie (kliknij w kolejności, kliknij wynik aby cofnąć):</p><div class="row" id="wpool">${words.map(w=>`<button class="btn sm g" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div><p id="wout" style="min-height:44px;border:1px dashed var(--line);border-radius:8px;padding:8px;cursor:pointer" title="kliknij aby cofnąć ostatnie"></p><div class="row"><button class="btn sm b" id="qok">Check ✓</button><button class="btn sm g" id="qskip">Skip →</button></div>`;}
else if(q.t==="tf"){h+=`<div class="row"><button class="opt" data-k="true">✅ True</button><button class="opt" data-k="false">❌ False</button></div>`;}
else{h+=shuffle(q.o.map((o,k)=>({o,k}))).map(x=>`<button class="opt" data-k="${x.k}">${esc(x.o)}</button>`).join("");}
h+=`</div></div>`;el.innerHTML=h;
const skip=el.querySelector("#qskip");if(skip)skip.onclick=()=>{log.push({q,ok:false,skip:true});S.mistakes.push(ctx+":"+q.q);save();i++;show();};
if(q.t==="choice"||q.t==="correct"||q.t==="tf"){el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{let ok;if(q.t==="tf")ok=(b.dataset.k==="true")===!!q.a;else ok=+b.dataset.k===q.a;
if(ok){b.classList.add("ok");score++;}else{b.classList.add("bad");if(q.t!=="tf"){const c=el.querySelector(`.opt[data-k="${q.a}"]`);if(c)c.classList.add("ok");}S.mistakes.push(ctx+":"+q.q);}
log.push({q,ok,given:b.textContent});el.querySelectorAll(".opt").forEach(x=>x.disabled=true);
el.innerHTML+=`<div class="${ok?"ex":"warn"}">${ok?"✅":"❌"} ${esc(q.exp||(ok?"Dobrze!":"Poprawnie: "+(q.t==="tf"?(q.a?"True":"False"):q.o[q.a])))}${q.rule?`<br><small>${esc(q.rule)}</small>`:""}</div>`;
setTimeout(()=>{i++;show();},ok?650:1600);});}
else if(q.t==="blank"||q.t==="translate"){const inp=el.querySelector("#qa");inp.focus&&inp.focus();const check=()=>{const v=norm(inp.value);const acc=Array.isArray(q.a)?q.a.map(norm):[norm(q.a)];const ok=acc.includes(v);
el.innerHTML+=ok?`<p style="color:var(--grn)">✅ ${esc(q.exp||"Dobrze!")}</p>`:`<p style="color:var(--red)">❌ Poprawnie: <b>${esc(Array.isArray(q.a)?q.a[0]:q.a)}</b>${q.exp?` — ${esc(q.exp)}`:""}</p>${q.rule?`<p style="color:var(--mut)"><small>${esc(q.rule)}</small></p>`:""}`;
if(ok)score++;else S.mistakes.push(ctx+":"+q.q);log.push({q,ok,given:inp.value});save();setTimeout(()=>{i++;show();},ok?700:1800);};
el.querySelector("#qok").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check();};}
else{let picked=[];const pool=el.querySelector("#wpool"),out=el.querySelector("#wout");pool.querySelectorAll("button").forEach(b=>b.onclick=()=>{picked.push(b.dataset.w);b.disabled=true;out.textContent=picked.join(" ");});out.onclick=()=>{const last=picked.pop();if(last==null)return;out.textContent=picked.join(" ");const b=[...pool.querySelectorAll("button")].find(x=>x.dataset.w===last&&x.disabled);if(b)b.disabled=false;};
el.querySelector("#qok").onclick=()=>{const acc=Array.isArray(q.a)?q.a.map(norm):[norm(q.a)];const ok=acc.includes(norm(picked.join(" ")));el.innerHTML+=ok?`<p style="color:var(--grn)">✅ Dobrze! ${esc(q.exp||"")}</p>`:`<p style="color:var(--red)">❌ Poprawnie: <b>${esc(Array.isArray(q.a)?q.a[0]:q.a)}</b></p>`;if(ok)score++;else S.mistakes.push(ctx+":"+q.q);log.push({q,ok,given:picked.join(" ")});save();setTimeout(()=>{i++;show();},1400);};}
}
function finish(timeout){stopT();const pct=Math.round(100*score/qs.length);
const byType={};log.forEach(l=>{const k=l.q.t;byType[k]=byType[k]||{ok:0,n:0};byType[k].n++;if(l.ok)byType[k].ok++;});
el.innerHTML=`<h3>${timeout?"⏱ Czas minął! ":""}Wynik: ${score}/${qs.length} (${pct}%)</h3><div class="bar"><i style="width:${pct}%"></i></div><p>${pct>=80?"🏆 Świetnie!":pct>=60?"👍 Dobrze, jeszcze chwila do perfekcji.":pct>=40?"📖 Nieźle — powtórz błędy poniżej.":"📖 Powtórz materiał, potem wróć."}</p><p>${Object.entries(byType).map(([k,v])=>`<span class="tag">${tLabel(k)}: ${v.ok}/${v.n}</span>`).join("")}</p>
${log.filter(l=>!l.ok).length?`<h3>❌ Do powtórki (${log.filter(l=>!l.ok).length})</h3>`+log.filter(l=>!l.ok).map((l,ix)=>`<div class="warn"><b>${esc(l.q.q)}</b><br>Twoja: ${esc(l.given||"—")} → Poprawnie: <b>${esc(Array.isArray(l.q.a)?l.q.a[0]:(l.q.t==="tf"?(l.q.a?"True":"False"):(l.q.o?l.q.o[l.q.a]:l.q.a)))}</b>${l.q.exp?`<br><small>${esc(l.q.exp)}</small>`:""}</div>`).join(""):`<p style="color:var(--grn)">🎉 Zero błędów!</p>`}
<div class="row" style="margin-top:8px"><button class="btn sm" id="rqAll">🔁 Powtórz quiz</button><button class="btn sm b" id="rqMiss">🎯 Tylko błędy (${log.filter(l=>!l.ok).length})</button><button class="btn sm g" onclick="go('review')">🧠 Review</button></div>`;
S.quizScores.push({ctx,score,total:qs.length,at:Date.now()});if(pct>=80)addXP(20,"quiz");else if(pct>=60)addXP(15,"quiz");else addXP(5,"quiz");save();checkAch();
el.querySelector("#rqAll").onclick=()=>renderQuiz(el,qs,ctx,opts);
const miss=log.filter(l=>!l.ok).map(l=>l.q);el.querySelector("#rqMiss").onclick=()=>{if(miss.length)renderQuiz(el,miss,ctx+"-miss",{});else toast("Brak błędów.");};}
window._rq=()=>renderQuiz(el,qs,ctx,opts);show();}

function genVocabQuiz(){const q=[];const pick=shuffle(VOCAB).slice(0,10);pick.forEach(v=>{const distract=shuffle(VOCAB.filter(x=>x[1]!==v[1])).slice(0,2).map(x=>x[1]);q.push({t:"choice",cat:"Vocabulary",level:v[5],q:`Co znaczy "${v[0]}"?`,o:shuffle([v[1],...distract]),a:0,exp:v[2]});q[q.length-1].a=q[q.length-1].o.indexOf(v[1]);q.push({t:"translate",cat:"Translation",level:v[5],q:`Przetłumacz: ${v[1]} → EN`,a:[v[0]],hint:v[2]});});return q;}
function allQuizQuestions(){const q=[];LESSONS.forEach(l=>l.quiz.forEach(x=>q.push({...x,ctx:l.id,cat:x.cat||"Lesson",level:l.level})));QUIZ_EXTRA.forEach(x=>q.push({...x,ctx:x.cat+"-"+x.level}));genVocabQuiz().forEach(x=>q.push({...x,ctx:"vocab-gen"}));PHRASALS.forEach(p=>q.push({t:"choice",cat:"Phrasal verbs",level:p[3],q:`"${p[0]}" znaczy:`,o:shuffle([p[1],...shuffle(PHRASALS.filter(x=>x[1]!==p[1])).slice(0,2).map(x=>x[1])]),a:0,ctx:"phr",exp:p[2]}));return q.map(x=>{if(x.t==="choice"&&x.o&&typeof x.a==="number"){const correct=x.o[x.a];const sh=shuffle(x.o);return {...x,o:sh,a:sh.indexOf(correct)};}return x;});}

window.knownV=id=>{if(!S.learnedVoc.includes(id)){S.learnedVoc.push(id);addXP(2,"voc");}else S.learnedVoc=S.learnedVoc.filter(x=>x!==id);save();checkAch();render();};

function vFlash(A){const deck=VOCAB.filter(v=>!S.learnedVoc.includes(v[0]));const card=deck[0]||VOCAB[0];A.innerHTML=`<div class="card" style="text-align:center"><h2>🔄 Flashcards (${deck.length} left)</h2><div class="flash"><div class="fcard" id="fc" tabindex="0" role="button" aria-label="Fiszka"><div id="fct"><b style="font-size:28px">${esc(card[0])}</b><small>kliknij, aby obrócić · ${esc(card[5])} · ${esc(card[4])}</small></div></div></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm g" onclick="gradeF('${esc(card[0])}',0)">Again</button><button class="btn sm g" onclick="gradeF('${esc(card[0])}',1)">Hard</button><button class="btn sm b" onclick="gradeF('${esc(card[0])}',2)">Good</button><button class="btn sm b" onclick="gradeF('${esc(card[0])}',3)">Easy</button></div><p style="color:var(--mut)">Wyniki zapisywane w localStorage.</p></div>`;
let back=false;const fc=$("#fc");const flip=()=>{back=!back;$("#fct").innerHTML=back?`${esc(card[1])}<br><small>${esc(card[2])} · ${esc(card[3])}</small><small>kliknij, aby wrócić</small>`:`<b style="font-size:28px">${esc(card[0])}</b><small>kliknij, aby obrócić</small>`;};fc.onclick=flip;fc.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};}
window.gradeF=(id,g)=>{S.flash[id]=(S.flash[id]||0)+g;if(g>=2&&!S.learnedVoc.includes(id)){S.learnedVoc.push(id);addXP(3,"flash");}if(g===0)S.learnedVoc=S.learnedVoc.filter(x=>x!==id);save();checkAch();toast(["🔁 Again","📖 Hard","👍 Good","⚡ Easy"][g]);render();};
/* ---- LISTEN / SPEAK / READ / WRITE / PRON / PHRASES ---- */
function vListen(A){A.innerHTML=`<div class="card"><h2>🎧 Listening (Web Speech API)</h2><div class="row"><label>Speed <select id="sp" style="max-width:120px"><option value="0.6">Slow</option><option value="1" selected>Normal</option><option value="1.3">Fast</option></select></label><button class="btn sm g" onclick="speechSynthesis.cancel()">⏸ Pause/Stop</button></div></div>${LISTEN.map((l,i)=>`<div class="card"><span class="lvl ${l.level}">${l.level}</span> <b>${esc(l.title)}</b><p>${esc(l.text)}</p><div class="row"><button class="btn sm" onclick="speak('${esc(l.text.replace(/'/g,""))}',parseFloat(document.querySelector('#sp').value))">▶ Play</button><button class="btn sm g" onclick="speechSynthesis.cancel()">⏹ Stop</button><button class="btn sm b" onclick="listenQuiz(${i})">❓ Pytania</button></div><div id="lq${i}"></div></div>`).join("")}`;}
window.listenQuiz=i=>{const qs=[{t:"choice",q:"Jaki jest główny temat nagrania '"+LISTEN[i].title+" nv?'",o:["Codzienna sytuacja","Polityka","Nauka"],a:0}];renderQuiz($("#lq"+i),qs,"listen"+i);};
function vSpeak(A){const ok=("webkitSpeechRecognition" in window||"SpeechRecognition" in window);A.innerHTML=`<div class="card"><h2>🎙 Speaking</h2>${ok?"<p>SpeechRecognition dostępne. Mów po angielsku.</p>":"<div class='warn'>⚠ Twoja przeglądarka nie obsługuje SpeechRecognition (Chrome na desktop/Android działa najlepiej). Możesz ćwiczyć z TTS i czytaniem na głos.</div>"}<div class="card"><b>Repeat:</b> "How's it going?"<div class="row"><button class="btn sm" onclick="speak(&quot;How's it going?&quot;)">🔊 Wzór</button><button class="btn sm b" id="recB">🎤 Nagrywaj / Sprawdź</button></div><p id="recO" style="color:var(--mut)">Wynik pojawi się tutaj.</p></div>
<div class="grid g2">${["Introduce yourself in 30 seconds.","Describe your yesterday.","Order coffee in English.","Give advice: I feel tired.","Talk about your plans.","[NAT] Use 3 fillers: well, you know, I mean."].map((p,i)=>`<div class="card"><b>Prompt ${i+1}</b><p>${esc(p)}</p><button class="btn sm b" onclick="speak('${esc(p.replace(/'/g,""))}')">🔊</button></div>`).join("")}</div></div>`;
const b=$("#recB");if(b&&ok)b.onclick=()=>{const R=new (window.SpeechRecognition||window.webkitSpeechRecognition)();R.lang="en-US";R.onresult=e=>{$("#recO").textContent="Usłyszano: "+e.results[0][0].transcript;addXP(5,"speak");save();};R.onerror=e=>{$("#recO").textContent="Błąd: "+e.error;};R.start();$("#recO").textContent="🎤 Słucham... mów!";};else if(b)b.onclick=()=>toast("Brak SpeechRecognition.");}
function vRead(A){if(PARAM!=null&&READINGS[PARAM]){const r=READINGS[PARAM];pushRecent("r:"+PARAM);return A.innerHTML=`<div class="card"><button class="btn sm g" onclick="go('read')">← Back</button> <span class="lvl ${r.level}">${r.level}</span><h2>${esc(r.title)}</h2><p style="font-size:17px">${esc(r.text)}</p><div class="row"><button class="btn sm" onclick="speak('${esc(r.text.replace(/'/g,"").slice(0,300))}')">🔊 Listen</button></div><h3>Vocabulary</h3>${r.voc.map(v=>`<span class="tag">${esc(v)}</span>`).join("")}<h3>Comprehension</h3><div id="rq"></div></div>`,renderQuiz($("#rq"),r.qs,"read"+PARAM);}
A.innerHTML=`<div class="card"><h2>📖 Reading A1–C2</h2></div><div class="grid g2">${READINGS.map((r,i)=>`<div class="card"><span class="lvl ${r.level}">${r.level}</span> <b>${esc(r.title)}</b><p style="color:var(--mut)">${esc(r.text.slice(0,110))}...</p><button class="btn sm" onclick="go('read',${i})">Czytaj + quiz</button></div>`).join("")}</div>`;}
function vWrite(A){A.innerHTML=`<div class="card"><h2>✍ Writing</h2><p>Checklisty: grammar · vocabulary · structure · coherence · naturalness. Samoocena + TTS do korekty (odsłuchaj tekst).</p></div>${WRITING.map((w,i)=>`<div class="card"><span class="lvl ${w.level}">${w.level}</span> <b>Task:</b> ${esc(w.task)}<textarea id="wt${i}" rows="4" placeholder="Write here..."></textarea><div class="row"><button class="btn sm" onclick="checkWrite(${i})">✓ Zakończ (+10 XP)</button><button class="btn sm g" onclick="speak(document.querySelector('#wt${i}').value.slice(0,400))">🔊 Odsłuchaj</button></div><p><b>Checklist:</b> ${w.check.map(c=>`<label style="display:block"><input type="checkbox" style="width:auto"> ${esc(c)}</label>`).join("")}</p><div id="wo${i}"></div></div>`).join("")}`;}
window.checkWrite=i=>{const v=$("#wt"+i).value.trim();if(v.length<10){$("#wo"+i).innerHTML="<p style='color:var(--red)'>Napisz minimum kilka słów.</p>";return;}addXP(10,"write");save();checkAch();$("#wo"+i).innerHTML="<p style='color:var(--grn)'>✅ Świetnie! +10 XP. Sprawdź checklistę powyżej.</p>";};
function vPron(A){A.innerHTML=`<div class="card"><h2>🗣 Pronunciation + IPA</h2></div>${PRON.map(p=>`<div class="card"><b>${esc(p.n)}</b> <code style="color:var(--blue)">${esc(p.ipa)}</code><p>${esc(p.tip)}</p><button class="btn sm" onclick="speak('${esc(p.n)}')">🔊</button></div>`).join("")}<div class="card"><h3>🇺🇸 US vs 🇬🇧 UK</h3><div class="two"><div class="good2"><b>US:</b> What's up? Awesome! Gotcha. /r/ mocne. </div><div class="bad2"><b>UK:</b> Cheers! Lovely! Brilliant! /r/ słabe, 'cuppa'.</div></div><h3 style="margin-top:10px">Textbook ❌ vs Natural ✅</h3>${NATIVE.map(n=>`<div class="two" style="margin-bottom:8px"><div class="bad2">❌ ${esc(n[0])}</div><div class="good2">✅ ${esc(n[1])}</div></div>`).join("")}</div>`;}
function vPhrases(A){A.innerHTML=`<div class="card"><h2>💬 Phrases</h2><input id="pq" placeholder="Szukaj zwrotu..."></div>${Object.entries(PHRASES).map(([c,arr])=>`<div class="card"><h3>${esc(c.replace("_"," "))}</h3>${arr.map(p=>`<span class="tag" style="cursor:pointer" onclick="speak('${esc(p.replace(/'/g,""))}')" title="kliknij aby odsłuchać">🔊 ${esc(p)}</span>`).join("")}</div>`).join("")}<div class="card"><h3>🔗 Phrasal verbs</h3><div class="tscroll"><table><tr><th>Phrase</th><th>PL</th><th>Ex</th><th>Lvl</th></tr>${PHRASALS.map(p=>`<tr><td><b>${esc(p[0])}</b></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td><td>${p[3]}</td></tr>`).join("")}</table></div></div><div class="card"><h3>🎭 Idioms</h3>${IDIOMS.map(x=>`<div class="ex"><b>${esc(x[0])}</b> — ${esc(x[1])} <small style="color:var(--mut)">(${esc(x[4])})</small><br><small>${esc(x[3])}</small></div>`).join("")}</div>`;
$("#pq").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll("#app .tag").forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?"":"none");};}
/* ---- QUIZZES / REVIEW / PROGRESS / ACH / SETTINGS ---- */
function vQuiz(A){if(PARAM==="daily"){const qs=shuffle(allQuizQuestions()).slice(0,8);return A.innerHTML=`<div class="card"><button class="btn sm g" onclick="go('quiz')">← Back</button><h2>⚡ Daily challenge (8 pytań, mix typów)</h2><div id="dq"></div></div>`,renderQuiz($("#dq"),qs,"daily");}
if(PARAM&&PARAM.startsWith("g:")){const n=PARAM.slice(2);const key=n.split(" ")[0].toLowerCase();const qs=allQuizQuestions().filter(q=>(q.q+" "+q.ctx+" "+(q.cat||"")).toLowerCase().includes(key)).slice(0,8);return A.innerHTML=`<div class="card"><button class="btn sm g" onclick="go('grammar')">← Back</button><h2>❓ Quiz: ${esc(n)}</h2><div id="gqq"></div></div>`,renderQuiz($("#gqq"),qs.length?qs:shuffle(allQuizQuestions()).slice(0,8),"gquiz");}
if(PARAM&&PARAM.startsWith("exam:")){const lv=PARAM.slice(5);const qs=shuffle(allQuizQuestions().filter(q=>q.level===lv)).slice(0,12);return A.innerHTML=`<div class="card"><button class="btn sm g" onclick="go('quiz')">← Back</button><h2>⏱ Egzamin ${esc(lv)} — 12 pytań, 120s</h2><div id="exq"></div></div>`,renderQuiz($("#exq"),qs.length?qs:shuffle(allQuizQuestions()).slice(0,12),"exam-"+lv,{timed:120});}
const total=S.quizScores.length,avg=total?Math.round(100*S.quizScores.reduce((a,s)=>a+s.score/s.total,0)/total):0,best=S.quizScores.reduce((a,s)=>Math.max(a,Math.round(100*s.score/s.total)),0);
A.innerHTML=`<div class="card"><h2>❓ Quizzes — centrum testów</h2>
<p style="color:var(--mut)">Typy: multiple choice · fill blank · translation PL→EN · correct the sentence · word order · true/false · reading · context. Wyniki: ${total} quizów · śr. ${avg}% · best ${best}%.</p>
<div class="row"><button class="btn" onclick="go('quiz','daily')">⚡ Daily (8)</button><button class="btn b" onclick="startMixed()">🎲 Mixed (10)</button><button class="btn g" onclick="startLevelQ()">📚 Mój poziom (${userLevel()})</button><button class="btn g" onclick="startMistakes()">🎯 Z moich błędów</button></div>
<div class="grid g3" style="margin-top:10px">
<div class="kpi">🎯 Tryb<select id="qMode"><option value="mixed">Mixed</option><option value="choice">Multiple choice</option><option value="blank">Fill blank</option><option value="translate">Translation</option><option value="correct">Correction</option><option value="order">Word order</option><option value="tf">True/False</option><option value="Vocabulary">Vocabulary</option><option value="Grammar">Grammar</option><option value="Phrasal verbs">Phrasal verbs</option></select></div>
<div class="kpi">📶 Poziom<select id="qLevel"><option value="ALL">ALL</option>${LEVELS.map(l=>`<option>${l}</option>`).join("")}</select></div>
<div class="kpi">🔢 Liczba<select id="qCount"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
</div><div class="row" style="margin-top:8px"><button class="btn b" onclick="startCustom()">▶ Start custom</button><button class="btn g" onclick="startExam()">⏱ Egzamin (${userLevel()}, 12q/120s)</button></div>
<div class="row" style="margin-top:8px">${LEVELS.map(l=>`<button class="btn sm g" onclick="startExamLv('${l}')">⏱ ${l}</button>`).join("")}</div>
<div id="mq" style="margin-top:10px"></div></div>
<div class="card"><h3>🏁 Historia (${total})</h3>${S.quizScores.slice(-10).reverse().map(s=>`<span class="tag">${esc(s.ctx)}: ${s.score}/${s.total} (${Math.round(100*s.score/s.total)}%)</span>`).join("")||"Brak. Zrób pierwszy quiz!"}<div class="row" style="margin-top:6px"><button class="btn sm g" onclick="confirmBox('Wyczyścić historię quizów?',()=>{S.quizScores=[];save();render();})">🗑 Wyczyść historię</button></div></div>`;}
window.startMixed=()=>{renderQuiz($("#mq"),shuffle(allQuizQuestions()).slice(0,10),"mixed");$("#mq").scrollIntoView({behavior:S.set.anim?"smooth":"auto",block:"start"});};
window.startLevelQ=()=>{const lv=userLevel();const pool=allQuizQuestions().filter(q=>q.level===lv);renderQuiz($("#mq"),pool.length?pool:shuffle(allQuizQuestions()).slice(0,10),"lvl-"+lv);$("#mq").scrollIntoView({behavior:"smooth"});};
window.startCustom=()=>{const m=$("#qMode").value,lv=$("#qLevel").value,n=+$("#qCount").value;let pool=allQuizQuestions();if(lv!=="ALL")pool=pool.filter(q=>q.level===lv);if(["choice","blank","translate","correct","order","tf"].includes(m))pool=pool.filter(q=>q.t===m);else pool=pool.filter(q=>q.cat===m);if(!pool.length)pool=allQuizQuestions();renderQuiz($("#mq"),shuffle(pool).slice(0,n),"custom-"+m+"-"+lv);$("#mq").scrollIntoView({behavior:"smooth"});};
window.startExam=()=>go("quiz","exam:"+userLevel());
window.startExamLv=lv=>go("quiz","exam:"+lv);
window.startMistakes=()=>{const all=allQuizQuestions();const miss=S.mistakes.map(m=>m.split(":").slice(1).join(":")).slice(-20);const qs=miss.map(t=>all.find(q=>q.q===t)).filter(Boolean);const pool=qs.length?qs:shuffle(all).slice(0,8);renderQuiz($("#mq"),pool,"mistakes");$("#mq").scrollIntoView({behavior:"smooth"});toast(qs.length?`Trenujesz ${qs.length} zaległych błędów.`:"Brak dopasowanych błędów — losowy mix.");};
function vReview(A){A.innerHTML=`<div class="card"><h2>🧠 Review / Powtórka</h2><div class="row"><button class="btn sm" onclick="addXP(8,'review');save();toast('+8 XP za powtórkę');render()">+ Powtórka (+8 XP)</button></div><h3>⭐ Bookmarks (${S.bookmarks.length})</h3>${S.bookmarks.map(id=>{const l=LESSONS.find(x=>x.id===id);return l?`<span class="tag"><a href="#" onclick="go('learn','${id}');return false">${esc(l.title)}</a></span>`:"";}).join("")||"Brak."}<h3>🕘 Recently viewed</h3>${S.recent.map(id=>`<span class="tag">${esc(id)}</span>`).join("")||"Brak."}<h3>❌ Mistake review (${S.mistakes.length})</h3>${S.mistakes.slice(-12).map(m=>`<div class="warn">${esc(m)}</div>`).join("")||"Brak błędów. 🎉"}<h3>⭐ Favorite vocab (${S.favVoc.length})</h3>${S.favVoc.map(w=>`<span class="tag">${esc(w)}</span>`).join("")||"Brak."}</div>`;}
function vProgress(A){const pct=totalPct();const days=Object.keys(S.xpHist).sort().slice(-7);A.innerHTML=`<div class="card"><h2>📊 Progress</h2><p>Ukończono: <b>${S.completed.length}/${LESSONS.length}</b> (${pct}%) · XP: <b>${S.xp}</b> · Streak: <b>${S.streak}</b></p><div class="bar"><i style="width:${pct}%"></i></div><h3>Poziomy</h3>${LEVELS.map(l=>`<p>${l} ${LEVEL_NAMES[l]} — ${donePct(l)}%</p><div class="bar"><i style="width:${donePct(l)}%"></i></div>`).join("")}<h3>XP ostatnie 7 dni</h3><div class="row">${days.map(d=>`<div class="kpi" style="min-width:90px">${d.slice(5)}<b>${S.xpHist[d]}</b></div>`).join("")||"Brak danych."}</div><div class="row" style="margin-top:10px"><button class="btn sm b" onclick="exportD()">⬇ Export JSON</button><button class="btn sm g" onclick="document.querySelector('#imp').click()">⬆ Import</button><input type="file" id="imp" accept=".json" style="display:none"><button class="btn sm g" onclick="confirmBox('Zresetować WSZYSTKO?',()=>{localStorage.removeItem('${LS}');location.reload();})">🗑 Reset</button></div></div>`;const f=$("#imp");if(f)f.onchange=e=>{const r=new FileReader();r.onload=()=>{try{localStorage.setItem(LS,r.result);location.reload();}catch(err){toast("Błędny plik.");}};r.readAsText(e.target.files[0]);};}
window.exportD=()=>{const b=new Blob([localStorage.getItem(LS)||"{}"],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="retro-english-progress.json";a.click();};
function vAch(A){const defs=ACH();A.innerHTML=`<div class="card"><h2>🏆 Achievements (${S.ach.length}/${defs.length})</h2><div class="grid g3">${defs.map(d=>`<div class="kpi" style="${S.ach.includes(d.id)?"border-color:var(--grn)":"opacity:.6"}">${S.ach.includes(d.id)?"🏆":"🔒"}<b style="font-size:15px">${esc(d.n)}</b><small>${esc(d.d)}</small></div>`).join("")}</div></div>`;}
function vSet(A){A.innerHTML=`<div class="card"><h2>⚙ Settings</h2>
<div class="grid g2"><div><label>Accent color<select id="sAcc"><option value="red">Red</option><option value="blue">Blue</option><option value="green">Green</option><option value="orange">Orange</option><option value="purple">Purple</option></select></label>
<label>Speech speed<select id="sSp"><option value="0.6">Slow</option><option value="1">Normal</option><option value="1.3">Fast</option></select></label>
<label>Interface<select id="sUi"><option value="pl">Polski</option><option value="en">English</option></select></label></div>
<div><label><input type="checkbox" id="sAn" style="width:auto"> Animations</label><br><label><input type="checkbox" id="sCrt" style="width:auto"> CRT / scanline effect</label><br><label><input type="checkbox" id="sSo" style="width:auto"> Sound</label></div></div>
<div class="row" style="margin-top:10px"><button class="btn sm b" onclick="exportD()">Export</button><button class="btn sm g" onclick="confirmBox('Reset?',()=>{localStorage.removeItem('${LS}');location.reload();})">Reset</button></div>
<p style="color:var(--mut)">Shortcuts: <kbd>1-9</kbd> nawigacja · <kbd>/</kbd> szukaj w sekcji · <kbd>Esc</kbd> zamknij modal</p></div>`;
$("#sAcc").value=S.set.accent;$("#sSp").value=String(S.set.speed);$("#sUi").value=S.set.ui;$("#sAn").checked=S.set.anim;$("#sCrt").checked=S.set.crt;$("#sSo").checked=S.set.sound;
$("#sAcc").onchange=e=>{S.set.accent=e.target.value;save();render();};$("#sSp").onchange=e=>{S.set.speed=parseFloat(e.target.value);save();};$("#sUi").onchange=e=>{S.set.ui=e.target.value;save();render();};
$("#sAn").onchange=e=>{S.set.anim=e.target.checked;save();render();};$("#sCrt").onchange=e=>{S.set.crt=e.target.checked;save();render();};$("#sSo").onchange=e=>{S.set.sound=e.target.checked;save();};}
/* ============ 9. GLOBAL SEARCH + KEYS ============ */
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeSide();}const idx=parseInt(e.key);if(idx>=1&&idx<=9&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){const v=NAV[idx-1];if(v)go(v[0]);}});
/* ============ 10. INIT ============ */
touchDay();renderNav();render();
</script>
</body>
</html>
